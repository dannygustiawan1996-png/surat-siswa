  .card {

  .klinik-alert-time { font-size: 10.5px; color: rgba(255,255,255,0.75); }

  .klinik-alert-sub { font-size: 12.5px; color: rgba(255,255,255,0.8); margin-bottom: 10px; }

  .hint { font-size: 13px; color: var(--color-ink-soft); line-height: 1.55; }

  .stamp.selesai { color: var(--color-green); }

  .stat-num { display: block; font-family: var(--font-display); font-size: 21px; color: var(--color-navy); font-weight: 700; }
  .stat-label { display: block; font-size: 9.5px; color: var(--color-ink-soft); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  .filter-row { display: flex; gap: 8px; margin: 16px 0; }

  .stat-block-title { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; color: var(--color-navy); margin: 0 0 12px; }
  .recap-list { display: flex; flex-direction: column; }
  .recap-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEE8DA; }
  .recap-row:last-child { border-bottom: none; }
  .recap-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .recap-label { flex: 1; font-size: 13px; color: var(--color-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recap-count { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--color-navy); flex-shrink: 0; }

  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #EEE8DA; font-size: 14px; }

  .detail-value { text-align: right; font-weight: 500; word-break: break-word; }

  .summary-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }

  function mapFullRow(row) {

      paymentChecked: row.payment_checked, paymentNote: row.payment_note, paymentDate: row.payment_date, paymentCode: row.payment_code, amount: row.amount,

  function toDbRow(req) {

      id: req.id, type: req.type, submitted_at: req.submittedAt, status: req.status,
      payment_checked: req.paymentChecked, payment_note: req.paymentNote, payment_date: req.paymentDate || null, payment_code: req.paymentCode, amount: req.amount,
      admin_note: req.adminNote, nomor_surat: req.nomorSurat || null, tanggal_surat: req.tanggalSurat || null, generated_text: req.generatedText,

  function backBar(view, label) {

  function render() {
    var app = document.getElementById('app');
    if (S.loading) { app.innerHTML = renderLoading(); return; }
    var html = '';
    switch (S.view) {
      case 'home': html = renderHome(); break;
      case 'pilihJenis': html = renderPilihJenis(); break;
      case 'form': html = renderForm(); break;
      case 'pembayaran': html = renderPembayaran(); break;
      case 'konfirmasi': html = renderKonfirmasi(); break;
      case 'cekStatus': html = renderCekStatus(); break;
      case 'adminGate': html = renderAdminGate(); break;
      case 'adminResetPassword': html = renderAdminResetPassword(); break;
      case 'adminDashboard': html = renderAdminDashboard(); break;
      case 'guruDashboard': html = renderGuruDashboard(); break;
      case 'klinikForm': html = renderKlinikForm(); break;
      case 'klinikSlip': html = renderKlinikSlip(); break;
      case 'klinikDashboard': html = renderKlinikDashboard(); break;
      case 'adminDetail':
        var detailReq = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
        if (!detailReq || (S.userRole === 'guru' && detailReq.type !== 'REKOMENDASI')) {
          S.view = S.userRole === 'guru' ? 'guruDashboard' : 'adminDashboard';
          html = S.userRole === 'guru' ? renderGuruDashboard() : renderAdminDashboard();
        } else {
          html = renderAdminDetail();
        }
        break;
      default: html = renderHome();
    }
    if (STUDENT_VIEWS.indexOf(S.view) !== -1) html = renderLangToggle() + html;
    app.innerHTML = html;

          if (groups[g] === undefined) { groups[g] = []; groupOrder.push(g); }
          groups[g].push(o);
        });

  function renderRekomendasiBody() {
    var rekomRequests = S.requests.filter(function (r) { return r.type === 'REKOMENDASI'; });

      if (S.guruFilterStatus !== 'all' && r.status !== S.guruFilterStatus) return false;
      return true;
    }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });

    var total = rekomRequests.length;
    var guruEntries = guruSlotEntries(rekomRequests);
    var menunggu = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'menunggu'; }).length;
    var diproses = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'diproses'; }).length;
    var selesai = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'selesai'; }).length;

    var statDetailHtml = '';
    if (S.guruStatFilter) {
      var matching = guruEntries.filter(function (e) { return guruStatBucket(e.status) === S.guruStatFilter; })
        .sort(function (a, b) {
          var ad = a.completedAt || a.req.submittedAt;
          var bd = b.completedAt || b.req.submittedAt;
          return new Date(bd) - new Date(ad);
        });
      var statLabel = { menunggu: 'Guru Menunggu', diproses: 'Guru Diproses', selesai: 'Guru Selesai' }[S.guruStatFilter];
      var rowsHtml = matching.map(function (e) {
        var timingHtml;
        if ((e.status === 'selesai' || e.status === 'ditolak') && e.completedAt) {
          var deltaMs = new Date(e.completedAt).getTime() - new Date(e.req.submittedAt).getTime();
          timingHtml = 'Diajukan ' + escapeHtml(formatDateShort(e.req.submittedAt)) + ' &rarr; ' + escapeHtml(statusLabelFor('REKOMENDASI', e.status)) + ' ' + escapeHtml(formatDateTimeFull(e.completedAt)) + (deltaMs >= 0 ? ' (' + escapeHtml(formatDuration(deltaMs)) + ')' : '');

          timingHtml = 'Diajukan ' + escapeHtml(formatDateShort(e.req.submittedAt)) + ' &middot; ' + escapeHtml(statusLabelFor('REKOMENDASI', e.status));

        return '<button class="card list-item" data-detail="' + e.req.id + '">' +
          '<div class="list-item-top"><span>' + escapeHtml(e.name) + '</span><span class="req-id-small">' + escapeHtml(e.req.id) + '</span></div>' +
          '<div class="list-item-bottom"><span>' + escapeHtml(e.req.data.namaLengkap || '-') + '</span></div>' +
          '<div class="hint" style="margin-top:4px;">' + timingHtml + '</div>' +
          noteHtml +
        '</button>';
      }).join('') || '<p class="hint">Belum ada.</p>';
      statDetailHtml = '<div class="stat-block"><p class="stat-block-title">Detail ' + escapeHtml(statLabel) + '</p>' + rowsHtml + '</div>';
    }

    var byGuru = tallyByMulti(rekomRequests, function (r) { return guruNamesFor(r.data); });
    var bySiswa = tallyBy(rekomRequests, function (r) { return r.data.namaLengkap; });
    var byUniv = tallyBy(rekomRequests, function (r) { return r.data.keperluan; });

    var rows = filtered.map(function (r) {
      var guruLinesHtml = guruSlotsFor(r.data).map(function (n) {
        var name = guruNameAt(r.data, n);
        var st = guruStatusAt(r.data, n, r.status);
        var completedAt = guruCompletedAtAt(r.data, n);
        var line = escapeHtml(name) + ': ' + escapeHtml(statusLabelFor('REKOMENDASI', st));
        if (st === 'selesai' && completedAt) line += ' (' + escapeHtml(formatDateShort(completedAt)) + ')';
        return '<div class="hint" style="margin-top:2px;">' + line + '</div>';
      }).join('');
      return '<button class="card list-item" data-detail="' + r.id + '">' +
        '<div class="list-item-top">' +
          '<span class="req-id-small">' + escapeHtml(r.id) + '</span>' +
          '<span class="stamp ' + r.status + '">' + escapeHtml(statusLabelFor(r.type, r.status)) + '</span>' +
        '</div>' +
        '<div class="list-item-bottom">' +
          '<span>' + escapeHtml(r.data.namaLengkap || '-') + '</span>' +
          '<span>' + escapeHtml(formatDateShortAdmin(r.submittedAt)) + '</span>' +
        '</div>' +
        guruLinesHtml +
      '</button>';
    }).join('') || '<p class="hint">Belum ada permintaan untuk filter ini.</p>';

    return '' +
      '<div class="stats-grid">' +
        '<div class="stat"><span class="stat-num">' + total + '</span><span class="stat-label">Total Permintaan</span></div>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'menunggu' ? ' active' : '') + '" data-statfilter="menunggu"><span class="stat-num">' + menunggu + '</span><span class="stat-label">Guru Menunggu</span></button>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'diproses' ? ' active' : '') + '" data-statfilter="diproses"><span class="stat-num">' + diproses + '</span><span class="stat-label">Guru Diproses</span></button>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'selesai' ? ' active' : '') + '" data-statfilter="selesai"><span class="stat-num">' + selesai + '</span><span class="stat-label">Guru Selesai</span></button>' +
      '</div>' +
      '<p class="hint" style="margin-top:-8px;">Klik salah satu angka guru di atas untuk lihat rinciannya.</p>' +
      statDetailHtml +
      '<div class="stat-block"><p class="stat-block-title">Rekap Guru</p>' + renderRecapList(byGuru) + '</div>' +
      '<div class="stat-block"><p class="stat-block-title">Rekap Siswa</p>' + renderRecapList(bySiswa) + '</div>' +
      '<div class="stat-block"><p class="stat-block-title">Rekap Univ</p>' + renderRecapList(byUniv) + '</div>' +
      '<div class="filter-row">' +
        '<select id="guruFilterStatus" class="field-input">' +
          '<option value="all"' + (S.guruFilterStatus === 'all' ? ' selected' : '') + '>Semua Status</option>' +
          '<option value="baru"' + (S.guruFilterStatus === 'baru' ? ' selected' : '') + '>Menunggu Diproses</option>' +
          '<option value="diproses"' + (S.guruFilterStatus === 'diproses' ? ' selected' : '') + '>Diproses</option>' +
          '<option value="link_bermasalah"' + (S.guruFilterStatus === 'link_bermasalah' ? ' selected' : '') + '>Link Bermasalah</option>' +
          '<option value="selesai"' + (S.guruFilterStatus === 'selesai' ? ' selected' : '') + '>Selesai</option>' +
          '<option value="ditolak"' + (S.guruFilterStatus === 'ditolak' ? ' selected' : '') + '>Ditolak</option>' +
        '</select>' +
      '</div>' +
      '<div class="stack">' + rows + '</div>' +
      '<button class="btn-outline" id="exportRekomendasiBtn" style="margin-top:12px">Export Arsip Rekomendasi (CSV)</button>';
  }

  function renderKlinikForm() {
    var t = LETTER_TYPES.IZIN_KLINIK;
    var draft = S.formDraft || {};
    var err = S.klinikErrors || {};
    function field(f) {
      var val = escapeHtml(draft[f.key] || '');
      var errHtml = err[f.key] ? '<span class="field-error">' + escapeHtml(err[f.key]) + '</span>' : '';
      var inputEl = f.type === 'textarea'

  function attachKlinikForm() {
    document.getElementById('klinikLogoutBtn').addEventListener('click', klinikLogoutHandler());
    document.querySelectorAll('#klinikDataForm .field-input').forEach(function (inp) {
      var handler = function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[inp.getAttribute('data-field')] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    document.getElementById('klinikDataForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var t = LETTER_TYPES.IZIN_KLINIK;
      var errors = {};
      t.fields.forEach(function (f) {
        if (f.required && !(S.formDraft[f.key] && String(S.formDraft[f.key]).trim())) errors[f.key] = tt('fieldWajib');
      });
      S.klinikErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Mengirim...';
      var newReq = {
        id: generateId('IZIN_KLINIK'), type: 'IZIN_KLINIK', submittedAt: new Date().toISOString(), status: 'baru',
        paymentChecked: false, paymentNote: '', paymentDate: null, paymentCode: null, amount: 0,
        adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
        data: Object.assign({}, S.formDraft)
      };
      var result = await insertRequest(newReq);
      if (!result.ok) {
        alert('Gagal mengirim: ' + result.error);
        submitBtn.disabled = false; submitBtn.textContent = 'Kirim & Terbitkan Izin';
        return;
      }
      S.requests = (S.requests || []).concat([newReq]);
      S.lastRequest = newReq;
      S.formDraft = {}; S.klinikErrors = {};
      go('klinikSlip');
    });
  }

    document.querySelectorAll('[data-klinik-selesai]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-klinik-selesai');
        if (!S.klinikPetugas || !S.klinikPetugas.trim()) {
          alert('Isi dulu nama Petugas Bertugas di atas sebelum menandai selesai.');
          var el = document.getElementById('klinikPetugasInput');
          if (el) el.focus();
          return;
        }
        var req = S.requests.find(function (r) { return r.id === id; });
        if (!req) return;
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        var prevStatus = req.status;
        var prevData = req.data;
        req.status = 'selesai';
        req.data = Object.assign({}, req.data, { petugasKlinik: S.klinikPetugas.trim(), completedAt: new Date().toISOString() });
        var result = await updateRequest(req);
        if (!result.ok) {
          alert('Gagal menyimpan: ' + result.error);
          req.status = prevStatus; req.data = prevData;
          btn.disabled = false; btn.textContent = 'Tandai Selesai';
          return;
        }
        render();
      });
    });

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var target = btn.getAttribute('data-go');
        if (target === 'home') {
          S.selectedType = null; S.formDraft = {}; S.formErrors = {};
          S.paymentChecked = false; S.paymentNote = ''; S.paymentDate = ''; S.pendingId = null;
          S.statusResults = null; S.statusQuery = '';
        }
        go(target);
      });
    });
    var langBtn = document.getElementById('langToggle');
    if (langBtn) langBtn.addEventListener('click', function (e) { e.preventDefault(); toggleLang(); });

    var adminLink = document.getElementById('adminLink');
    if (adminLink) adminLink.addEventListener('click', async function (e) {
      e.preventDefault();
      if (S.adminAuthed) { S.requests = await getRequestsAdmin(); go(dashboardViewFor(S.userRole)); }
      else go('adminGate');
    });

  function attachPilihJenis() {
    document.querySelectorAll('.type-card').forEach(function (card) {
      card.addEventListener('click', function () {
        S.selectedType = card.getAttribute('data-type');
        S.formDraft = {}; S.formErrors = {};
        go('form');
      });
    });
  }

  function attachForm() {
    var formEl = document.getElementById('dataForm');
    document.querySelectorAll('.field-input').forEach(function (inp) {
      var handler = function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[inp.getAttribute('data-field')] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    formEl.addEventListener('submit', async function (e) {
      e.preventDefault();
      var t = LETTER_TYPES[S.selectedType];
      var errors = {};
      t.fields.forEach(function (f) {
        if (f.required && !(S.formDraft[f.key] && String(S.formDraft[f.key]).trim())) errors[f.key] = tt('fieldWajib');
      });
      S.formErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var id = generateId(S.selectedType);
      S.pendingId = id;
      if (t.noPayment) {
        var submitBtn = formEl.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = tt('mengirim');
        var newReq = {
          id: id, type: S.selectedType, submittedAt: new Date().toISOString(), status: 'baru',
          paymentChecked: false, paymentNote: '', paymentDate: null, paymentCode: null, amount: 0,
          adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
          data: Object.assign({}, S.formDraft)
        };
        var result = await insertRequest(newReq);
        if (!result.ok) {
          alert(tt('gagalKirim')(result.error));
          submitBtn.disabled = false; submitBtn.textContent = tt('kirimPermintaan');
          return;
        }
        S.lastRequest = newReq;
        S.pendingId = null;
        go('konfirmasi');
        return;
      }
      go('pembayaran');
    });
  }

  function attachPembayaran() {
    var chk = document.getElementById('paymentChecked');
    chk.addEventListener('change', function () { S.paymentChecked = chk.checked; });
    var noteInp = document.getElementById('paymentNote');
    noteInp.addEventListener('input', function () { S.paymentNote = noteInp.value; });
    var dateInp = document.getElementById('paymentDate');
    dateInp.addEventListener('input', function () { S.paymentDate = dateInp.value; });
    document.getElementById('submitRequestBtn').addEventListener('click', async function () {
      if (!S.paymentChecked) { S.formErrors._payment = tt('checkPaymentFirst'); render(); return; }
      var errors = {};
      if (!S.paymentNote || !S.paymentNote.trim()) errors.paymentNote = tt('fieldWajib');
      if (!S.paymentDate) errors.paymentDate = tt('fieldWajib');
      S.formErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var feeForType = (LETTER_TYPES[S.selectedType].fee || FEE);
      var newReq = {
        id: S.pendingId, type: S.selectedType, submittedAt: new Date().toISOString(), status: 'baru',
        paymentChecked: S.paymentChecked, paymentNote: S.paymentNote, paymentDate: S.paymentDate, paymentCode: null, amount: feeForType,
        adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
        data: Object.assign({}, S.formDraft)
      };
      var btn = document.getElementById('submitRequestBtn');
      btn.disabled = true; btn.textContent = tt('mengirim');
      var result = await insertRequest(newReq);
      if (!result.ok) {
        alert(tt('gagalKirim')(result.error));
        btn.disabled = false; btn.textContent = tt('kirimPermintaan');
        return;
      }
      S.lastRequest = newReq;
      S.paymentChecked = false; S.paymentNote = ''; S.paymentDate = ''; S.pendingId = null;
      go('konfirmasi');
    });
  }

  async function runStatusSearch() {
    var q = S.statusQuery.trim().toLowerCase();
    if (!q) { S.statusResults = []; return; }
    var all = await getRequestsPublic();
    S.statusResults = all.filter(function (r) {
      return r.id.toLowerCase().indexOf(q) !== -1 || (r.data.namaLengkap || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  function attachCekStatus() {
    var inp = document.getElementById('statusQuery');
    inp.addEventListener('input', function () { S.statusQuery = inp.value; });
    document.getElementById('searchStatusBtn').addEventListener('click', async function () {
      var btn = document.getElementById('searchStatusBtn');
      btn.disabled = true; btn.textContent = tt('mencari');
      await runStatusSearch();
      btn.disabled = false; btn.textContent = tt('cari');
      render();
    });
    document.querySelectorAll('[data-fixlink]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-fixlink');
        var input = document.getElementById('fixLinkInput-' + id);
        var newLink = input.value.trim();
        if (!newLink) { S.fixLinkMessages[id] = tt('linkBaruKosong'); render(); return; }
        btn.disabled = true; btn.textContent = tt('mengirimLinkBaru');
        var result = await fixRekomendasiLink(id, newLink);
        if (result.ok) {
          S.fixLinkMessages[id] = tt('linkBaruBerhasil');
          await runStatusSearch();
        } else {
          S.fixLinkMessages[id] = tt('linkBaruGagal')(result.error);
          btn.disabled = false; btn.textContent = tt('kirimLinkBaru');
        }
        render();
      });
    });
  }

  function attachAdminGate() {
    document.getElementById('adminLoginBtn').addEventListener('click', async function () {
      var btn = document.getElementById('adminLoginBtn');
      var email = document.getElementById('adminEmail').value.trim();
      var password = document.getElementById('adminPassword').value;
      document.getElementById('adminError').textContent = '';
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      var result = await adminLogin(email, password);
      btn.disabled = false; btn.textContent = 'Masuk';
      if (!result.ok) { document.getElementById('adminError').textContent = 'Login gagal: ' + result.error; return; }
      S.adminAuthed = true;
      S.userRole = await getCurrentRole();
      S.requests = await getRequestsAdmin();
      go(dashboardViewFor(S.userRole));
    });
    document.getElementById('forgotPasswordBtn').addEventListener('click', async function () {
      var btn = document.getElementById('forgotPasswordBtn');
      var email = document.getElementById('adminEmail').value.trim();
      if (!email) { S.forgotStatus = 'Isi dulu email admin di atas, ya.'; render(); return; }
      btn.disabled = true; btn.textContent = 'Mengirim...';
      var result = await sendPasswordReset(email);
      S.forgotStatus = result.ok ? 'sent' : ('Gagal mengirim: ' + result.error);
      render();
    });

  function attachAdminResetPassword() {
    document.getElementById('savePasswordBtn').addEventListener('click', async function () {
      var pw = document.getElementById('newPassword').value;
      var pw2 = document.getElementById('newPasswordConfirm').value;
      var errEl = document.getElementById('resetPasswordError');
      errEl.textContent = '';
      if (pw.length < 6) { errEl.textContent = 'Password minimal 6 karakter.'; return; }
      if (pw !== pw2) { errEl.textContent = 'Password tidak sama, coba lagi.'; return; }
      var btn = document.getElementById('savePasswordBtn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      var result = await updateAdminPassword(pw);
      btn.disabled = false; btn.textContent = 'Simpan Password Baru';
      if (!result.ok) { errEl.textContent = 'Gagal menyimpan: ' + result.error; return; }
      S.adminAuthed = true;
      S.userRole = await getCurrentRole();
      S.requests = await getRequestsAdmin();
      go(dashboardViewFor(S.userRole));
    });
  }

      var csv = buildCsv(S.requests.filter(function (r) { return !isDedicatedTabType(r.type); }));
      try { await navigator.clipboard.writeText(csv); alert('CSV disalin ke clipboard. Paste ke Excel/Sheets.'); }
      catch (e) { alert('Gagal menyalin otomatis.'); console.log(csv); }
    });
    document.getElementById('editSettingsBtn').addEventListener('click', function () {
      S.adminEditingSettings = !S.adminEditingSettings; render();
    });
    var saveBtn = document.getElementById('saveSettingsBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', async function () {
        var val = document.getElementById('paymentInfoInput').value;
        var nextNum = parseInt(document.getElementById('nextSuratInput').value, 10) || 1;
        S.settings = Object.assign({}, S.settings || {}, { paymentInfo: val, nextSuratNumber: nextNum });
        await saveSettings(S.settings);
        S.adminEditingSettings = false;
        render();
      });
    }
  }

  function buildCsv(requests) {
    var headers = ['ID', 'Jenis', 'Tanggal', 'Status', 'Nama', 'Jumlah', 'Nomor Surat', 'Detail (JSON)'];
    var lines = [headers.join(',')];
    requests.forEach(function (r) {
      var nama = r.data.namaLengkap || '';
      var rest = JSON.stringify(r.data).replace(/"/g, '""');
      lines.push([r.id, r.type, r.submittedAt, r.status, '"' + nama + '"', r.amount || '', r.nomorSurat || '', '"' + rest + '"'].join(','));
    });
    return lines.join('\n');
  }
  function csvField(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
  function buildRekomendasiCsv(requests) {
    var headers = ['Kode Permintaan', 'Nama Siswa', 'Kelas / Alumni', 'Keperluan / Universitas', 'Alamat Email', 'Link Form Rekomendasi', 'Link Surat Jadi', 'Status Keseluruhan', 'Tanggal Diajukan', 'Guru 1', 'Status Guru 1', 'Catatan Guru 1', 'Selesai Guru 1', 'Guru 2', 'Status Guru 2', 'Catatan Guru 2', 'Selesai Guru 2', 'Guru 3', 'Status Guru 3', 'Catatan Guru 3', 'Selesai Guru 3'];
    var lines = [headers.map(csvField).join(',')];
    requests.slice().sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); }).forEach(function (r) {
      var d = r.data || {};
      var row = [
        r.id,
        d.namaLengkap || '',
        d.kelas || '',
        d.keperluan || '',
        d.kontak || '',
        d.linkForm || '',
        d.linkSuratJadi || '',
        statusLabelFor(r.type, r.status),
        formatDateTimeFull(r.submittedAt)
      ];
      [1, 2, 3].forEach(function (n) {
        var name = guruNameAt(d, n);
        if (!name) { row.push('', '', '', ''); return; }
        var st = guruStatusAt(d, n, r.status);
        var completedAt = guruCompletedAtAt(d, n);
        row.push(name, statusLabelFor('REKOMENDASI', st), guruCatatanAt(d, n), completedAt ? formatDateTimeFull(completedAt) : '');
      });
      lines.push(row.map(csvField).join(','));
    });
    return lines.join('\n');
  }
  function downloadCsv(filename, csvContent) {
    var blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function attachAdminDetail() {
    document.getElementById('saveDetailBtn').addEventListener('click', async function () {
      var req = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
      var prevStatus = req.status;
      var isRekomendasiReq = req.type === 'REKOMENDASI';

      if (isRekomendasiReq) {
        var dataUpdates = {};
        var historyEntries = [];
        guruSlotsFor(req.data).forEach(function (n) {
          var selectEl = document.getElementById('guruStatusSelect-' + n);
          var noteEl = document.getElementById('guruNoteInput-' + n);
          if (!selectEl) return;
          var newSt = selectEl.value;
          var newNote = noteEl ? noteEl.value : '';
          var oldSt = guruStatusAt(req.data, n, prevStatus);
          var oldNote = guruCatatanAt(req.data, n);
          dataUpdates['guruStatus' + n] = newSt;
          dataUpdates['guruCatatan' + n] = newNote;
          if (newSt === 'selesai' && !guruCompletedAtAt(req.data, n)) {
            dataUpdates['guruCompletedAt' + n] = new Date().toISOString();
          }
          if (newSt !== oldSt || newNote !== oldNote) {
            historyEntries.push({ status: newSt, note: newNote || '', at: new Date().toISOString(), guru: guruNameAt(req.data, n) });
          }
        });
        var linkSuratJadiInput = document.getElementById('linkSuratJadiInput');
        if (linkSuratJadiInput) dataUpdates.linkSuratJadi = linkSuratJadiInput.value.trim();
        if (historyEntries.length) dataUpdates.statusHistory = (req.data.statusHistory || []).concat(historyEntries);
        req.data = Object.assign({}, req.data, dataUpdates);
        req.status = computeOverallGuruStatus(req.data, prevStatus);
      } else {
        req.status = document.getElementById('statusSelect').value;
        req.adminNote = document.getElementById('adminNoteInput').value;
        var genArea = document.getElementById('generatedTextArea');
        if (genArea) req.generatedText = genArea.value;
        var nomorInput = document.getElementById('nomorSuratInput');
        if (nomorInput) req.nomorSurat = nomorInput.value.trim();
        var tglInput = document.getElementById('tanggalSuratInput');
        if (tglInput) req.tanggalSurat = tglInput.value;
      }

      var btn = document.getElementById('saveDetailBtn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      var result = await updateRequest(req);
      btn.disabled = false; btn.textContent = 'Simpan Perubahan';
      if (!result.ok) { alert('Gagal menyimpan: ' + result.error); return; }
      go(dashboardViewFor(S.userRole));
    });
    var generateLetterBtn = document.getElementById('generateLetterBtn');
    if (generateLetterBtn) generateLetterBtn.addEventListener('click', async function () {
      var req = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
      var nomor = document.getElementById('nomorSuratInput').value.trim();
      var tanggal = document.getElementById('tanggalSuratInput').value;
      var isFirstTime = !req.generatedText;
      var text = generateLetterText(req, nomor, tanggal);
      document.getElementById('generatedTextArea').value = text;
      req.nomorSurat = nomor;
      req.tanggalSurat = tanggal;
      req.generatedText = text;
      await updateRequest(req);
      if (isFirstTime) {
        var currentNext = (S.settings && S.settings.nextSuratNumber) || 1;
        S.settings = Object.assign({}, S.settings || {}, { nextSuratNumber: currentNext + 1 });
        await saveSettings(S.settings);
      }
    });
    var copyLetterBtn = document.getElementById('copyLetterBtn');
    if (copyLetterBtn) copyLetterBtn.addEventListener('click', async function () {
      var text = document.getElementById('generatedTextArea').value;
      try { await navigator.clipboard.writeText(text); alert('Teks surat disalin! Tinggal paste ke template & print.'); }
      catch (e) { alert('Gagal menyalin otomatis. Salin manual dari kotak teks di atas.'); }
    });
    document.getElementById('deleteReqBtn').addEventListener('click', async function () {
      if (!confirm('Hapus permintaan ini? Tindakan tidak bisa dibatalkan.')) return;
      var ok = await deleteRequestRow(S.adminSelectedId);
      if (!ok) { alert('Gagal menghapus.'); return; }
      S.requests = S.requests.filter(function (r) { return r.id !== S.adminSelectedId; });
      go(dashboardViewFor(S.userRole));
    });
  }

  ['mousemove', 'click', 'keydown', 'touchstart'].forEach(function (evt) {
    document.addEventListener(evt, function () {
      if (S.view === 'klinikDashboard' && !S.klinikIdle) resetKlinikIdleTimer();
    });
  });

  async function init() {
    S.settings = await getSettings();
    S.adminAuthed = await hasAdminSession();
    if (S.adminAuthed) { S.userRole = await getCurrentRole(); S.requests = await getRequestsAdmin(); }
    S.loading = false;
    render();
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') go('adminResetPassword');
    });
  }
  init();
</script>
