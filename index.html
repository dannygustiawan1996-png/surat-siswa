<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layanan Surat Siswa — UPH College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --color-navy: #1B2A4A;
    --color-navy-light: #2C4270;
    --color-paper: #F6F2E9;
    --color-card: #FFFFFF;
    --color-brass: #A6803D;
    --color-ink: #262420;
    --color-ink-soft: #6B6560;
    --color-red: #B4453A;
    --color-green: #3F6F4C;
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  * { box-sizing: border-box; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  body {
    margin: 0;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; min-height: 100vh; }
  @media (min-width: 820px) { #app { max-width: 680px; padding-top: 52px; } }

  h1, h2 { font-family: var(--font-display); color: var(--color-navy); margin: 0 0 8px; }
  h1 { font-size: 27px; font-weight: 700; }
  h2 { font-size: 20px; font-weight: 600; margin-top: 4px; margin-bottom: 16px; }

  .hero { text-align: center; margin-bottom: 26px; }
  .hero.small { margin-bottom: 18px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--color-brass); margin: 0 0 6px; }
  .sub { color: var(--color-ink-soft); font-size: 14px; line-height: 1.55; margin: 8px auto 0; max-width: 320px; }

  .seal {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--color-brass);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--color-brass);
    margin: 0 auto 14px;
  }
  .logo { display: block; margin: 0 auto 16px; max-width: 240px; width: 100%; height: auto; }

  .stack { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }

  .card {
    background: var(--color-card);
    border-left: 3px solid var(--color-navy);
    border-radius: 4px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(27,42,74,0.08);
    margin-bottom: 12px;
  }
  .card.center { text-align: center; }

  .notice-card { background: #FBEDEA; border-left: 3px solid var(--color-red); border-radius: 4px; padding: 14px 16px; margin: 14px 0; font-size: 13.5px; line-height: 1.55; color: var(--color-ink); }
  .pickup-card { background: #EAF3EC; border-left: 3px solid var(--color-green); border-radius: 4px; padding: 10px 14px; margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--color-ink); }
  .info-card { background: #FBF3E4; border-left: 3px solid var(--color-brass); border-radius: 4px; padding: 14px 16px; margin: 12px 0; font-size: 13px; line-height: 1.55; color: var(--color-ink); }

  .type-card {
    display: flex; flex-direction: column; gap: 6px; text-align: left;
    background: var(--color-card); border: none; border-left: 3px solid var(--color-navy);
    border-radius: 4px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(27,42,74,0.08);
    font-family: var(--font-body); width: 100%;
  }
  .type-card:hover { border-left-color: var(--color-brass); }
  .type-card-label { font-family: var(--font-display); font-size: 15.5px; color: var(--color-navy); font-weight: 600; }
  .type-card-desc { font-size: 12.5px; color: var(--color-ink-soft); line-height: 1.45; }
  .type-card-fee { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-brass); margin-top: 2px; }

  .btn-primary {
    background: var(--color-navy); color: var(--color-paper); border: none; border-radius: 4px;
    padding: 14px 20px; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; width: 100%;
  }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-outline {
    background: transparent; color: var(--color-navy); border: 1.5px solid var(--color-navy);
    border-radius: 4px; padding: 13px 20px; font-size: 15px; font-weight: 600; width: 100%;
  }
  .btn-text { background: none; border: none; color: var(--color-ink-soft); font-size: 14px; text-decoration: underline; padding: 8px; width: 100%; }
  .btn-text.danger { color: var(--color-red); }

  .back-btn { background: none; border: none; color: var(--color-ink-soft); font-size: 13px; padding: 0; margin-bottom: 18px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .top-row .back-btn { margin-bottom: 0; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .field-label { font-size: 12px; letter-spacing: 0.3px; color: var(--color-ink-soft); text-transform: uppercase; }
  .req { color: var(--color-red); }
  .field-input {
    border: none; border-bottom: 2px solid #D8D2C4; background: transparent; padding: 8px 2px;
    font-family: var(--font-body); font-size: 15px; color: var(--color-ink); outline: none; width: 100%;
  }
  .field-input:focus { border-bottom-color: var(--color-brass); }
  textarea.field-input { resize: vertical; min-height: 60px; }
  select.field-input { border: 1px solid #D8D2C4; border-radius: 4px; padding: 10px; background: var(--color-card); }
  .field-error { color: var(--color-red); font-size: 12px; }

  .checkbox-field { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; }
  .checkbox-field input { width: 18px; height: 18px; flex-shrink: 0; }

  .hint { font-size: 13px; color: var(--color-ink-soft); line-height: 1.55; }
  .hint.center { text-align: center; }

  .stamp {
    display: inline-block; padding: 5px 14px; border: 2px dashed currentColor;
    border-radius: 50% / 40%; transform: rotate(-3deg); font-family: var(--font-mono);
    font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; margin: 8px 0;
  }
  .stamp.baru { color: var(--color-red); }
  .stamp.lunas { color: var(--color-brass); }
  .stamp.selesai { color: var(--color-green); }

  .req-id { font-family: var(--font-mono); font-size: 19px; color: var(--color-navy); font-weight: 600; margin: 6px 0; }
  .req-id-small { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-navy); }
  .amount-big { font-family: var(--font-mono); font-size: 26px; color: var(--color-navy); font-weight: 700; margin: 4px 0; }
  .mono { font-family: var(--font-mono); }
  .mono-area { font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; line-height: 1.5; }

  .list-item { display: block; width: 100%; text-align: left; font-family: var(--font-body); }
  button.list-item { border: none; border-left: 3px solid var(--color-navy); background: var(--color-card); }
  .list-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
  .list-item-bottom { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--color-ink-soft); gap: 8px; }

  .footer-link { text-align: center; margin-top: 34px; }
  .footer-link a { color: var(--color-ink-soft); font-size: 12px; text-decoration: none; opacity: 0.55; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
  .stat { background: var(--color-card); border-radius: 4px; padding: 12px 4px; text-align: center; box-shadow: 0 1px 3px rgba(27,42,74,0.08); }
  .stat-num { display: block; font-family: var(--font-display); font-size: 21px; color: var(--color-navy); font-weight: 700; }
  .stat-label { display: block; font-size: 9.5px; color: var(--color-ink-soft); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  .filter-row { display: flex; gap: 8px; margin: 16px 0; }
  .filter-row .field-input { flex: 1; }

  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #EEE8DA; font-size: 14px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--color-ink-soft); flex-shrink: 0; }
  .detail-value { text-align: right; font-weight: 500; word-break: break-word; }

  .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
  .summary-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  // ============================================================
  // KONFIGURASI SUPABASE — isi 2 nilai ini dari Project Settings > API
  // di dashboard Supabase kamu setelah menjalankan schema.sql
  // ============================================================
  var SUPABASE_URL = 'https://jxyfiinqxeswyljmzhge.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_mRKDBw_XWZwHPAZQFEKYDg_n6au_AkQ';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var FEE = 25000;
  var DEFAULT_PAYMENT_INFO = 'Transfer ke CIMB Niaga 800.10.907.7600 a.n. Yayasan Pendidikan Pelita Harapan, lalu centang konfirmasi di bawah.';
  var MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  var GENDER_OPTIONS = [{ value: 'L', label: 'Laki-laki', labelEn: 'Male' }, { value: 'P', label: 'Perempuan', labelEn: 'Female' }];

  function pronoun(g) {
    if (g === 'P') return { subject: 'she', possessive: 'her', object: 'her' };
    return { subject: 'he', possessive: 'his', object: 'him' };
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function parseDateParts(dateStr) {
    var parts = (dateStr || '').split('-');
    return { y: parseInt(parts[0], 10) || 0, m: (parseInt(parts[1], 10) || 1) - 1, d: parseInt(parts[2], 10) || 0 };
  }
  function formatDateEN(dateStr) {
    if (!dateStr) return '____________';
    var p = parseDateParts(dateStr);
    return MONTHS_EN[p.m] + ' ' + p.d + ', ' + p.y;
  }
  function formatDateID(dateStr) {
    if (!dateStr) return '____________';
    var p = parseDateParts(dateStr);
    return p.d + ' ' + MONTHS_ID[p.m] + ' ' + p.y;
  }
  function romanMonth(dateStr) { return ROMAN[parseDateParts(dateStr).m]; }
  function yearOf(dateStr) { return parseDateParts(dateStr).y; }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function suggestedNomor(settings, tanggalStr) {
    var next = (settings && settings.nextSuratNumber) || 1;
    return String(next).padStart(4, '0') + '/DI/UPHC/' + romanMonth(tanggalStr) + '/' + yearOf(tanggalStr);
  }

  var LETTER_TYPES = {
    KETERANGAN: {
      shortLabel: 'Ket. Siswa',
      shortLabelEn: 'Student Status',
      label: 'Surat Keterangan Siswa',
      labelEn: 'Student Status Letter',
      desc: 'Konfirmasi status siswa aktif di kelas & tahun ajaran tertentu — untuk keperluan umum.',
      descEn: 'Confirms active student status in a specific grade & academic year — for general purposes.',
      fields: [
        { key: 'namaLengkap', label: 'Nama Lengkap', labelEn: 'Full Name', type: 'text', required: true },
        { key: 'ttl', label: 'Tempat, Tanggal Lahir', labelEn: 'Place, Date of Birth', placeholder: 'Contoh: Tangerang, 12 Mei 2008', placeholderEn: 'e.g. Tangerang, May 12, 2008', type: 'text', required: true },
        { key: 'studentId', label: 'Student ID / NISN', labelEn: 'Student ID / NISN', type: 'text', required: true },
        { key: 'kelas', label: 'Kelas', labelEn: 'Grade/Class', placeholder: 'Contoh: 12A', placeholderEn: 'e.g. 12A', type: 'text', required: true },
        { key: 'tahunAjaran', label: 'Tahun Ajaran', labelEn: 'Academic Year', placeholder: 'Contoh: 2026/2027', placeholderEn: 'e.g. 2026/2027', type: 'text', required: true },
        { key: 'kontak', label: 'Alamat Email', labelEn: 'Email Address', placeholder: 'nama@email.com', placeholderEn: 'name@email.com', type: 'email', required: true },
        { key: 'catatanSiswa', label: 'Catatan Tambahan (opsional)', labelEn: 'Additional Notes (optional)', placeholder: 'Contoh: Mohon surat dibuat dalam Bahasa Indonesia', placeholderEn: 'e.g. Please prepare the letter in Indonesian', type: 'textarea', required: false }
      ],
      generator: function (d, nomor, tgl) {
        return 'Tangerang, ' + formatDateEN(tgl) + '\n\n' +
          'LETTER OF STATEMENT\n' +
          'No. : ' + nomor + '\n\n' +
          'The undersigned below :\n\n' +
          'Name              : Hans Deny\n' +
          'Position          : Academic Principal\n' +
          'School Address    : Jl. MH Thamrin Boulevard 1100, Lippo Village\n\n' +
          'hereby declares and truly confirms that the student listed below :\n\n' +
          'Name                  : ' + d.namaLengkap + '\n' +
          'Place, Date of Birth  : ' + d.ttl + '\n' +
          'Student ID            : ' + d.studentId + '\n\n' +
          'is a grade ' + d.kelas + ' student of UPH College in the Academic Year ' + d.tahunAjaran + '.\n\n' +
          'This letter of statement is issued to be used as required.\n\n' +
          'Sincerely,\n\n\n' +
          'Hans Deny\n' +
          'Academic Principal';
      }
    },
    SKL_EXPECTED: {
      shortLabel: 'SKL (Belum Lulus)',
      shortLabelEn: 'SKL (Not Graduated)',
      label: 'SKL Luar Negeri — Belum Lulus',
      labelEn: 'Overseas SKL — Not Yet Graduated',
      desc: 'Untuk siswa yang belum lulus, dipakai buat daftar universitas luar negeri (expected graduation).',
      descEn: "For students who haven't graduated yet, used for overseas university applications (expected graduation).",
      fields: [
        { key: 'namaLengkap', label: 'Nama Lengkap', labelEn: 'Full Name', type: 'text', required: true },
        { key: 'jenisKelamin', label: 'Jenis Kelamin', labelEn: 'Gender', type: 'select', options: GENDER_OPTIONS, required: true },
        { key: 'major', label: 'Jurusan / Program Studi (jika ada)', labelEn: 'Major / Study Program (if any)', type: 'text', required: false },
        { key: 'studentNumber', label: 'Student Number', labelEn: 'Student Number', type: 'text', required: true },
        { key: 'tahunAjaran', label: 'Tahun Ajaran', labelEn: 'Academic Year', placeholder: 'Contoh: 2026/2027', placeholderEn: 'e.g. 2026/2027', type: 'text', required: true },
        { key: 'expectedLulus', label: 'Perkiraan Bulan & Tahun Lulus', labelEn: 'Expected Graduation Month & Year', placeholder: 'Contoh: June 2027', placeholderEn: 'e.g. June 2027', type: 'text', required: true },
        { key: 'namaUniversitas', label: 'Nama Universitas Tujuan', labelEn: 'Destination University Name', type: 'text', required: true },
        { key: 'kontak', label: 'Alamat Email', labelEn: 'Email Address', placeholder: 'nama@email.com', placeholderEn: 'name@email.com', type: 'email', required: true },
        { key: 'catatanSiswa', label: 'Catatan Tambahan (opsional)', labelEn: 'Additional Notes (optional)', placeholder: 'Contoh: Mohon surat dibuat dalam Bahasa Indonesia', placeholderEn: 'e.g. Please prepare the letter in Indonesian', type: 'textarea', required: false }
      ],
      generator: function (d, nomor, tgl) {
        var p = pronoun(d.jenisKelamin);
        return 'Tangerang, ' + formatDateEN(tgl) + '\n\n' +
          'LETTER OF STATEMENT\n' +
          'No. : ' + nomor + '\n\n' +
          'This letter serves to certify that,\n\n' +
          'Name             : ' + d.namaLengkap + '\n' +
          'Major            : ' + (d.major || '-') + '\n' +
          'Student Number   : ' + d.studentNumber + '\n\n' +
          'is a grade 12 student at UPH College for the ' + d.tahunAjaran + ' Academic Year and is expected to complete ' + p.possessive + ' course of study in ' + d.expectedLulus + '.\n\n' +
          'This letter of statement is intended for admission purposes to ' + d.namaUniversitas + '.\n\n' +
          'Faithfully Yours,\n\n\n' +
          'Hans Deny\n' +
          'Academic Principal';
      }
    },
    SKL_COMPLETED: {
      shortLabel: 'SKL (Lulus)',
      shortLabelEn: 'SKL (Graduated)',
      label: 'SKL Luar Negeri — Sudah Lulus',
      labelEn: 'Overseas SKL — Graduated',
      desc: 'Untuk siswa yang sudah lulus, dipakai buat daftar universitas luar negeri (graduation).',
      descEn: 'For graduated students, used for overseas university applications (graduation).',
      fields: [
        { key: 'namaLengkap', label: 'Nama Lengkap', labelEn: 'Full Name', type: 'text', required: true },
        { key: 'jenisKelamin', label: 'Jenis Kelamin', labelEn: 'Gender', type: 'select', options: GENDER_OPTIONS, required: true },
        { key: 'major', label: 'Jurusan / Program Studi (jika ada)', labelEn: 'Major / Study Program (if any)', type: 'text', required: false },
        { key: 'studentNumber', label: 'Student Number', labelEn: 'Student Number', type: 'text', required: true },
        { key: 'tahunAjaran', label: 'Tahun Ajaran', labelEn: 'Academic Year', placeholder: 'Contoh: 2025/2026', placeholderEn: 'e.g. 2025/2026', type: 'text', required: true },
        { key: 'tanggalLulus', label: 'Tanggal Lulus', labelEn: 'Graduation Date', type: 'date', required: true },
        { key: 'namaUniversitas', label: 'Nama Universitas Tujuan', labelEn: 'Destination University Name', type: 'text', required: true },
        { key: 'kontak', label: 'Alamat Email', labelEn: 'Email Address', placeholder: 'nama@email.com', placeholderEn: 'name@email.com', type: 'email', required: true },
        { key: 'catatanSiswa', label: 'Catatan Tambahan (opsional)', labelEn: 'Additional Notes (optional)', placeholder: 'Contoh: Mohon surat dibuat dalam Bahasa Indonesia', placeholderEn: 'e.g. Please prepare the letter in Indonesian', type: 'textarea', required: false }
      ],
      generator: function (d, nomor, tgl) {
        var p = pronoun(d.jenisKelamin);
        return 'Tangerang, ' + formatDateEN(tgl) + '\n\n' +
          'LETTER OF STATEMENT\n' +
          'No. : ' + nomor + '\n\n' +
          'This letter serves to certify that,\n\n' +
          'Name             : ' + d.namaLengkap + '\n' +
          'Major            : ' + (d.major || '-') + '\n' +
          'Student Number   : ' + d.studentNumber + '\n\n' +
          'is a grade 12 student of UPH College in the Academic Year ' + d.tahunAjaran + ' and has completed ' + p.possessive + ' course of study and graduated on ' + formatDateEN(d.tanggalLulus) + '.\n\n' +
          'This is also to confirm that in UPH College report cards are printed in English and the expected learning outcome (minimum passing grade) for students is 65.\n\n' +
          'This letter of statement is intended for admission purposes to ' + d.namaUniversitas + '.\n\n' +
          'Faithfully Yours,\n\n\n' +
          'Hans Deny\n' +
          'Academic Principal';
      }
    },
    ANAK_KARYAWAN: {
      shortLabel: 'Anak Karyawan',
      shortLabelEn: "Employee's Child",
      label: 'Surat Keterangan Anak Karyawan',
      labelEn: "Employee's Child Certificate",
      desc: 'Untuk pengajuan bantuan dana pendidikan anak karyawan ke tempat kerja orang tua.',
      descEn: "For applying for employee children's education assistance at the parent's workplace.",
      fields: [
        { key: 'namaLengkap', label: 'Nama Lengkap', labelEn: 'Full Name', type: 'text', required: true },
        { key: 'ttl', label: 'Tempat, Tanggal Lahir', labelEn: 'Place, Date of Birth', placeholder: 'Contoh: Tangerang, 12 Mei 2008', placeholderEn: 'e.g. Tangerang, May 12, 2008', type: 'text', required: true },
        { key: 'namaAyah', label: 'Nama Ayah', labelEn: "Father's Name", type: 'text', required: true },
        { key: 'namaIbu', label: 'Nama Ibu', labelEn: "Mother's Name", type: 'text', required: true },
        { key: 'alamat', label: 'Alamat', labelEn: 'Address', type: 'textarea', required: true },
        { key: 'kelas', label: 'Kelas', labelEn: 'Grade/Class', placeholder: 'Contoh: 10A', placeholderEn: 'e.g. 10A', type: 'text', required: true },
        { key: 'tahunAjaran', label: 'Tahun Ajaran', labelEn: 'Academic Year', placeholder: 'Contoh: 2026/2027', placeholderEn: 'e.g. 2026/2027', type: 'text', required: true },
        { key: 'namaPerusahaan', label: 'Nama Tempat Kerja Orang Tua', labelEn: "Parent's Workplace Name", type: 'text', required: true },
        { key: 'kontak', label: 'Alamat Email', labelEn: 'Email Address', placeholder: 'nama@email.com', placeholderEn: 'name@email.com', type: 'email', required: true },
        { key: 'catatanSiswa', label: 'Catatan Tambahan (opsional)', labelEn: 'Additional Notes (optional)', placeholder: 'Contoh: Mohon surat dibuat dalam Bahasa Indonesia', placeholderEn: 'e.g. Please prepare the letter in Indonesian', type: 'textarea', required: false }
      ],
      generator: function (d, nomor, tgl) {
        return 'Tangerang, ' + formatDateID(tgl) + '\n\n' +
          'SURAT KETERANGAN\n' +
          'No. : ' + nomor + '\n\n' +
          'Yang bertandatangan di bawah ini :\n\n' +
          'Nama         : Hans Deny\n' +
          'Jabatan      : Kepala Sekolah\n' +
          'Alamat SMA   : Jl. MH Thamrin Boulevard 1100, Karawaci\n\n' +
          'menyatakan dan menerangkan dengan sesungguhnya bahwa siswa yang tercantum di bawah ini :\n\n' +
          'Nama                     : ' + d.namaLengkap + '\n' +
          'Tempat, Tanggal Lahir    : ' + d.ttl + '\n' +
          'Nama Ayah                : ' + d.namaAyah + '\n' +
          'Nama Ibu                 : ' + d.namaIbu + '\n' +

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatDateShort(iso) {

    catch (e) { return iso; }
  }
  function formatDateShortAdmin(iso) {
    try {
      var d = new Date(iso);
      var tgl = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      var jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
      return tgl + ' · ' + jam;
    } catch (e) { return iso; }
  }
  function formatDateTimeFull(iso) {
    try {
      var d = new Date(iso);
      var tgl = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      var jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
      return tgl + ', ' + jam;
    } catch (e) { return iso; }
  }
  function formatRupiah(n) { return 'Rp' + n.toLocaleString('id-ID'); }
  function generateId(type) {
    var d = new Date();
    var yy = String(d.getFullYear()).slice(-2);
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    var rand = Math.random().toString(36).slice(2, 6).toUpperCase();
    return type + '-' + yy + mm + dd + '-' + rand;
  }

  function toDbRow(req) {

      payment_checked: req.paymentChecked, payment_note: req.paymentNote, payment_date: req.paymentDate || null, payment_code: req.paymentCode, amount: req.amount,

  async function getRequestsAdmin() {
    try {

  async function insertRequest(req) {

  }

      var res = await sb.from('requests').update(toDbRow(req)).eq('id', req.id);
      if (res.error) return { ok: false, error: res.error.message };
      return { ok: true };
    } catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }

  function render() {
    var app = document.getElementById('app');
    if (S.loading) { app.innerHTML = renderLoading(); return; }
    var html = '';
    switch (S.view) {
      case 'home': html = renderHome(); break;
      case 'pilihJenis': html = renderPilihJenis(); break;
      case 'form': html = renderForm(); break;
      case 'pembayaran': html = renderPembayaran(); break;
      case 'konfirmasi': html = renderKonfirmasi(); break;
      case 'cekStatus': html = renderCekStatus(); break;
      case 'adminGate': html = renderAdminGate(); break;
      case 'adminDashboard': html = renderAdminDashboard(); break;
      case 'adminDetail': html = renderAdminDetail(); break;
      default: html = renderHome();
    }
    if (STUDENT_VIEWS.indexOf(S.view) !== -1) html = renderLangToggle() + html;
    app.innerHTML = html;
    attachHandlers();
  }

  function renderLoading() { return '<div class="loading-screen"><div class="stamp lunas">Memuat...</div></div>'; }

  function renderHome() {
    return '' +
      '<div class="hero">' +
        '<img src="UPHC-Horizontal.png" alt="UPH College" class="logo">' +
        '<h1>' + escapeHtml(tt('homeTitle')) + '</h1>' +
        '<p class="sub">' + escapeHtml(tt('homeSub')) + '</p>' +
      '</div>' +
      '<div class="stack">' +
        '<button class="btn-primary" data-go="pilihJenis">' + escapeHtml(tt('ajukanSurat')) + '</button>' +
        '<button class="btn-outline" data-go="cekStatus">' + escapeHtml(tt('cekStatusBtn')) + '</button>' +
      '</div>' +
      '<div class="footer-link"><a href="#" id="adminLink">Admin</a></div>';
  }

  function renderPilihJenis() {
    var cards = Object.keys(LETTER_TYPES).map(function (key) {
      var t = LETTER_TYPES[key];
      return '<button class="type-card" data-type="' + key + '">' +
        '<span class="type-card-label">' + escapeHtml(typeLabel(t)) + '</span>' +
        '<span class="type-card-desc">' + escapeHtml(typeDesc(t)) + '</span>' +
        '<span class="type-card-fee">' + formatRupiah(t.fee || FEE) + '</span>' +
      '</button>';
    }).join('');
    return backBar('home', tt('beranda')) + '<h2>' + escapeHtml(tt('pilihJenisTitle')) + '</h2><div class="stack">' + cards + '</div>';

  function renderForm() {
    var t = LETTER_TYPES[S.selectedType];
    if (!t) return renderPilihJenis();
    var fieldsHtml = t.fields.map(function (f) {
      var val = escapeHtml((S.formDraft && S.formDraft[f.key]) || '');
      var err = S.formErrors[f.key] ? '<span class="field-error">' + escapeHtml(S.formErrors[f.key]) + '</span>' : '';
      var inputEl;
      if (f.type === 'textarea') {
        inputEl = '<textarea class="field-input" data-field="' + f.key + '" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" rows="2">' + val + '</textarea>';
      } else if (f.type === 'select') {
        var opts = f.options.map(function (o) {
          return '<option value="' + o.value + '"' + ((S.formDraft && S.formDraft[f.key]) === o.value ? ' selected' : '') + '>' + escapeHtml(optionLabel(o)) + '</option>';
        }).join('');
        inputEl = '<select class="field-input" data-field="' + f.key + '"><option value="">' + escapeHtml(tt('pilihOpsi')) + '</option>' + opts + '</select>';
      } else if (f.type === 'date') {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="date" value="' + val + '">';
      } else if (f.type === 'email') {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="email" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" value="' + val + '">';
      } else {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="text" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" value="' + val + '">';
      }
      return '<label class="field">' +
        '<span class="field-label">' + escapeHtml(fieldLabel(f)) + (f.required ? ' <span class="req">*</span>' : '') + '</span>' +
        inputEl + err +
      '</label>';
    }).join('');
    var noticeHtml = t.notice ? '<div class="notice-card">' + escapeHtml(S.lang === 'en' ? (t.noticeEn || t.notice) : t.notice) + '</div>' : '';
    return backBar('pilihJenis', tt('jenisSurat')) +
      '<h2>' + escapeHtml(typeLabel(t)) + '</h2>' +
      '<p class="hint">' + escapeHtml(tt('formHint')) + '</p>' +
      noticeHtml +
      '<form id="dataForm" class="stack">' + fieldsHtml + '<button type="submit" class="btn-primary">' + escapeHtml(tt('lanjutPembayaran')) + '</button></form>';
  }

  function attachHandlers() {
    document.querySelectorAll('[data-go]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        var target = btn.getAttribute('data-go');
        if (target === 'home') {
          S.selectedType = null; S.formDraft = {}; S.formErrors = {};
          S.paymentChecked = false; S.paymentNote = ''; S.paymentDate = ''; S.pendingId = null;
          S.statusResults = null; S.statusQuery = '';
        }
        go(target);
      });
    });
    var langBtn = document.getElementById('langToggle');
    if (langBtn) langBtn.addEventListener('click', function (e) { e.preventDefault(); toggleLang(); });

    var adminLink = document.getElementById('adminLink');
    if (adminLink) adminLink.addEventListener('click', async function (e) {
      e.preventDefault();
      if (S.adminAuthed) { S.requests = await getRequestsAdmin(); go('adminDashboard'); }
      else go('adminGate');
    });

    switch (S.view) {
      case 'pilihJenis': attachPilihJenis(); break;
      case 'form': attachForm(); break;
      case 'pembayaran': attachPembayaran(); break;
      case 'cekStatus': attachCekStatus(); break;
      case 'adminGate': attachAdminGate(); break;
      case 'adminDashboard': attachAdminDashboard(); break;
      case 'adminDetail': attachAdminDetail(); break;
    }
  }

  function attachPilihJenis() {
    document.querySelectorAll('.type-card').forEach(function (card) {
      card.addEventListener('click', function () {
        S.selectedType = card.getAttribute('data-type');
        S.formDraft = {}; S.formErrors = {};
        go('form');
      });
    });
  }

  function attachForm() {
    var formEl = document.getElementById('dataForm');
    document.querySelectorAll('.field-input').forEach(function (inp) {
      var handler = function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[inp.getAttribute('data-field')] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      var t = LETTER_TYPES[S.selectedType];
      var errors = {};
      t.fields.forEach(function (f) {
        if (f.required && !(S.formDraft[f.key] && String(S.formDraft[f.key]).trim())) errors[f.key] = tt('fieldWajib');
      });
      S.formErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var id = generateId(S.selectedType);
      S.pendingId = id;
      go('pembayaran');
    });
  }

  function attachPembayaran() {
    var chk = document.getElementById('paymentChecked');
    chk.addEventListener('change', function () { S.paymentChecked = chk.checked; });
    var noteInp = document.getElementById('paymentNote');
    noteInp.addEventListener('input', function () { S.paymentNote = noteInp.value; });
    var dateInp = document.getElementById('paymentDate');
    dateInp.addEventListener('input', function () { S.paymentDate = dateInp.value; });
    document.getElementById('submitRequestBtn').addEventListener('click', async function () {
      if (!S.paymentChecked) { S.formErrors._payment = tt('checkPaymentFirst'); render(); return; }
      var errors = {};
      if (!S.paymentNote || !S.paymentNote.trim()) errors.paymentNote = tt('fieldWajib');
      if (!S.paymentDate) errors.paymentDate = tt('fieldWajib');
      S.formErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var feeForType = (LETTER_TYPES[S.selectedType].fee || FEE);
      var newReq = {
        id: S.pendingId, type: S.selectedType, submittedAt: new Date().toISOString(), status: 'baru',
        paymentChecked: S.paymentChecked, paymentNote: S.paymentNote, paymentDate: S.paymentDate, paymentCode: null, amount: feeForType,
        adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
        data: Object.assign({}, S.formDraft)
      };
      var btn = document.getElementById('submitRequestBtn');
      btn.disabled = true; btn.textContent = tt('mengirim');
      var result = await insertRequest(newReq);
      if (!result.ok) {
        alert(tt('gagalKirim')(result.error));
        btn.disabled = false; btn.textContent = tt('kirimPermintaan');
        return;
      }
      S.lastRequest = newReq;
      S.paymentChecked = false; S.paymentNote = ''; S.paymentDate = ''; S.pendingId = null;
      go('konfirmasi');
    });
  }

  function attachCekStatus() {
    var inp = document.getElementById('statusQuery');
    inp.addEventListener('input', function () { S.statusQuery = inp.value; });
    document.getElementById('searchStatusBtn').addEventListener('click', async function () {
      var q = S.statusQuery.trim().toLowerCase();
      if (!q) { S.statusResults = []; render(); return; }
      var btn = document.getElementById('searchStatusBtn');
      btn.disabled = true; btn.textContent = tt('mencari');
      var all = await getRequestsPublic();
      btn.disabled = false; btn.textContent = tt('cari');
      S.statusResults = all.filter(function (r) {
        return r.id.toLowerCase().indexOf(q) !== -1 || (r.data.namaLengkap || '').toLowerCase().indexOf(q) !== -1;
      });
      render();
    });
  }

  function attachAdminGate() {
    document.getElementById('adminLoginBtn').addEventListener('click', async function () {
      var btn = document.getElementById('adminLoginBtn');
      var email = document.getElementById('adminEmail').value.trim();
      var password = document.getElementById('adminPassword').value;
      document.getElementById('adminError').textContent = '';
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      var result = await adminLogin(email, password);
      btn.disabled = false; btn.textContent = 'Masuk';
      if (!result.ok) { document.getElementById('adminError').textContent = 'Login gagal: ' + result.error; return; }
      S.adminAuthed = true;
      S.requests = await getRequestsAdmin();
      go('adminDashboard');
    });
  }

  function attachAdminDashboard() {
    document.getElementById('filterType').addEventListener('change', function (e) { S.adminFilterType = e.target.value; render(); });
    document.getElementById('filterStatus').addEventListener('change', function (e) { S.adminFilterStatus = e.target.value; render(); });
    document.getElementById('adminLogoutBtn').addEventListener('click', async function () {
      await adminLogout();
      S.adminAuthed = false; S.requests = [];
      go('home');
    });
    document.querySelectorAll('[data-detail]').forEach(function (btn) {
      btn.addEventListener('click', function () { S.adminSelectedId = btn.getAttribute('data-detail'); go('adminDetail'); });
    });
    document.getElementById('exportBtn').addEventListener('click', async function () {
      var csv = buildCsv(S.requests);
      try { await navigator.clipboard.writeText(csv); alert('CSV disalin ke clipboard. Paste ke Excel/Sheets.'); }
      catch (e) { alert('Gagal menyalin otomatis.'); console.log(csv); }
    });
    document.getElementById('editSettingsBtn').addEventListener('click', function () {
      S.adminEditingSettings = !S.adminEditingSettings; render();
    });
    var saveBtn = document.getElementById('saveSettingsBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', async function () {
        var val = document.getElementById('paymentInfoInput').value;
        var nextNum = parseInt(document.getElementById('nextSuratInput').value, 10) || 1;
        S.settings = Object.assign({}, S.settings || {}, { paymentInfo: val, nextSuratNumber: nextNum });
        await saveSettings(S.settings);
        S.adminEditingSettings = false;
        render();
      });
    }
  }

  function buildCsv(requests) {
    var headers = ['ID', 'Jenis', 'Tanggal', 'Status', 'Nama', 'Jumlah', 'Nomor Surat', 'Detail (JSON)'];
    var lines = [headers.join(',')];
    requests.forEach(function (r) {
      var nama = r.data.namaLengkap || '';
      var rest = JSON.stringify(r.data).replace(/"/g, '""');
      lines.push([r.id, r.type, r.submittedAt, r.status, '"' + nama + '"', r.amount || '', r.nomorSurat || '', '"' + rest + '"'].join(','));
    });
    return lines.join('\n');
  }

  function attachAdminDetail() {
    document.getElementById('saveDetailBtn').addEventListener('click', async function () {
      var req = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
      req.status = document.getElementById('statusSelect').value;
      req.adminNote = document.getElementById('adminNoteInput').value;
      var genArea = document.getElementById('generatedTextArea');
      if (genArea) req.generatedText = genArea.value;
      var nomorInput = document.getElementById('nomorSuratInput');
      if (nomorInput) req.nomorSurat = nomorInput.value.trim();
      var tglInput = document.getElementById('tanggalSuratInput');
      if (tglInput) req.tanggalSurat = tglInput.value;
      var btn = document.getElementById('saveDetailBtn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      var result = await updateRequest(req);
      btn.disabled = false; btn.textContent = 'Simpan Perubahan';
      if (!result.ok) { alert('Gagal menyimpan: ' + result.error); return; }
      go('adminDashboard');
    });
    document.getElementById('generateLetterBtn').addEventListener('click', async function () {
      var req = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
      var nomor = document.getElementById('nomorSuratInput').value.trim();
      var tanggal = document.getElementById('tanggalSuratInput').value;
      var isFirstTime = !req.generatedText;
      var text = generateLetterText(req, nomor, tanggal);
      document.getElementById('generatedTextArea').value = text;
      req.nomorSurat = nomor;
      req.tanggalSurat = tanggal;
      req.generatedText = text;
      await updateRequest(req);
      if (isFirstTime) {
        var currentNext = (S.settings && S.settings.nextSuratNumber) || 1;
        S.settings = Object.assign({}, S.settings || {}, { nextSuratNumber: currentNext + 1 });
        await saveSettings(S.settings);
      }
    });
    document.getElementById('copyLetterBtn').addEventListener('click', async function () {
      var text = document.getElementById('generatedTextArea').value;
      try { await navigator.clipboard.writeText(text); alert('Teks surat disalin! Tinggal paste ke template & print.'); }
      catch (e) { alert('Gagal menyalin otomatis. Salin manual dari kotak teks di atas.'); }
    });
    document.getElementById('deleteReqBtn').addEventListener('click', async function () {
      if (!confirm('Hapus permintaan ini? Tindakan tidak bisa dibatalkan.')) return;
      var ok = await deleteRequestRow(S.adminSelectedId);
      if (!ok) { alert('Gagal menghapus.'); return; }
      S.requests = S.requests.filter(function (r) { return r.id !== S.adminSelectedId; });
      go('adminDashboard');
    });
  }

  async function init() {
    S.settings = await getSettings();
    S.adminAuthed = await hasAdminSession();
    if (S.adminAuthed) S.requests = await getRequestsAdmin();
    S.loading = false;
    render();
  }
  init();
</script>
</body>
</html>
