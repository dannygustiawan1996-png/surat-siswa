<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layanan Surat Siswa — UPH College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --color-navy: #1B2A4A;
    --color-navy-light: #2C4270;
    --color-paper: #F6F2E9;
    --color-card: #FFFFFF;
    --color-brass: #A6803D;
    --color-ink: #262420;
    --color-ink-soft: #6B6560;
    --color-red: #B4453A;
    --color-green: #3F6F4C;
    --font-display: 'Source Serif 4', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }
  * { box-sizing: border-box; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  body {
    margin: 0;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; min-height: 100vh; }
  @media (min-width: 820px) { #app { max-width: 680px; padding-top: 52px; } }

  h1, h2 { font-family: var(--font-display); color: var(--color-navy); margin: 0 0 8px; }
  h1 { font-size: 27px; font-weight: 700; }
  h2 { font-size: 20px; font-weight: 600; margin-top: 4px; margin-bottom: 16px; }

  .hero { text-align: center; margin-bottom: 26px; }
  .hero.small { margin-bottom: 18px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--color-brass); margin: 0 0 6px; }
  .sub { color: var(--color-ink-soft); font-size: 14px; line-height: 1.55; margin: 8px auto 0; max-width: 320px; }

  .seal {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--color-brass);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--color-brass);
    margin: 0 auto 14px;
  }
  .logo { display: block; margin: 0 auto 16px; max-width: 240px; width: 100%; height: auto; }

  .stack { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }

  .card {
    background: var(--color-card);
    border-left: 3px solid var(--color-navy);
    border-radius: 4px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(27,42,74,0.08);
    margin-bottom: 12px;
  }
  .card.center { text-align: center; }

  .notice-card { background: #FBEDEA; border-left: 3px solid var(--color-red); border-radius: 4px; padding: 14px 16px; margin: 14px 0; font-size: 13.5px; line-height: 1.55; color: var(--color-ink); }
  .cek-status-pita { background: #FFF4CC; border: 1.5px solid #E0B43C; border-radius: 4px; padding: 10px 14px; font-size: 13px; line-height: 1.5; color: var(--color-ink); text-align: center; margin-top: 6px; }
  .btn-cek-status { border-width: 2px; background: #FFFBEA; animation: cek-denyut 1.6s ease-in-out infinite, cek-getar 3s ease-in-out infinite; }
  .btn-cek-status:hover, .btn-cek-status:focus { animation: none; }
  @keyframes cek-denyut { 0%, 100% { box-shadow: 0 0 0 0 rgba(224, 180, 60, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(224, 180, 60, 0); } }
  /* getar seperti HP berdering: diam ~2 detik, lalu bergetar kuat ~1 detik */
  @keyframes cek-getar {
    0%, 62%, 100% { transform: translateX(0) rotate(0); }
    65% { transform: translateX(-8px) rotate(-2deg); } 68% { transform: translateX(8px) rotate(2deg); }
    71% { transform: translateX(-8px) rotate(-2deg); } 74% { transform: translateX(8px) rotate(2deg); }
    77% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(6px) rotate(1.5deg); }
    83% { transform: translateX(-4px) rotate(-1deg); } 86% { transform: translateX(4px) rotate(1deg); }
    90% { transform: translateX(-2px); } 94% { transform: translateX(2px); }
  }
  @keyframes cek-goyang { 0%, 100% { transform: translateX(0); } 15%, 45%, 75% { transform: translateX(-8px) rotate(-1.5deg); } 30%, 60%, 90% { transform: translateX(8px) rotate(1.5deg); } }
  .cek-status-pita { animation: cek-getar 3s ease-in-out infinite; animation-delay: 1.5s; }
  .jangan-ulang-card { background: #FFF4CC; border: 2px solid #E0B43C; border-radius: 6px; padding: 16px 18px; margin: 16px 0; font-size: 14px; line-height: 1.55; color: var(--color-ink); animation: cek-getar 3s ease-in-out infinite, cek-denyut 1.6s ease-in-out infinite; }
  .jangan-ulang-card:hover { animation: none; }
  .jangan-ulang-card p { margin: 0 0 10px; }
  .jangan-ulang-judul { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--color-red); }
  .jangan-ulang-aksi { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .dobel-overlay { position: fixed; inset: 0; background: rgba(27, 42, 74, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
  .dobel-box { background: var(--color-card); border-radius: 8px; border-top: 5px solid #E0B43C; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); animation: cek-goyang .7s ease-in-out 3; }
  .dobel-box h3 { font-family: var(--font-display); color: var(--color-navy); margin: 0 0 8px; font-size: 18px; }
  .dobel-box p { font-size: 13.5px; line-height: 1.5; margin: 0 0 10px; color: var(--color-ink); }
  .dobel-item { border-left: 3px solid var(--color-brass); background: var(--color-paper); padding: 8px 12px; margin: 8px 0; font-size: 13px; line-height: 1.5; }
  .dobel-box .stack { margin-top: 14px; }
  /* Perangkat dengan animasi dikurangi (mis. Windows "Animation effects" off): tetap bergetar, tapi lebih halus */
  @keyframes cek-getar-lembut { 0%, 70%, 100% { transform: translateX(0); } 74%, 82%, 90% { transform: translateX(-5px); } 78%, 86%, 94% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) {
    .btn-cek-status, .cek-status-pita, .jangan-ulang-card { animation: cek-getar-lembut 3s ease-in-out infinite; }
    .dobel-box { animation: cek-getar-lembut 1s ease-in-out 2; }
  }
  .pickup-card { background: #EAF3EC; border-left: 3px solid var(--color-green); border-radius: 4px; padding: 10px 14px; margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: var(--color-ink); }
  .info-card { background: #FBF3E4; border-left: 3px solid var(--color-brass); border-radius: 4px; padding: 14px 16px; margin: 12px 0; font-size: 13px; line-height: 1.55; color: var(--color-ink); }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--color-ink-soft); text-transform: uppercase; margin: 14px 0 8px; }

  .prapen-overlay { position: fixed; inset: 0; background: rgba(27,42,74,0.55); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .prapen-modal { position: relative; background: var(--color-card); border-radius: 8px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
  .prapen-body { padding: 22px 20px 20px; }
  .prapen-close { position: absolute; top: 6px; right: 10px; background: none; border: none; font-size: 26px; line-height: 1; color: var(--color-ink-soft); }
  .eyebrow-pp { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--color-brass); margin: 0 0 6px; }
  .prapen-block { margin: 16px 0; }
  .prapen-q { margin: 0 0 8px; font-weight: 600; font-size: 14px; line-height: 1.45; }
  .prapen-opt { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; padding: 5px 0; cursor: pointer; }
  .prapen-opt input { margin-top: 3px; }
  .prapen-scale { display: flex; gap: 6px; }
  .prapen-scale label { flex: 1; cursor: pointer; }
  .prapen-scale input { position: absolute; opacity: 0; pointer-events: none; }
  .prapen-scale span { display: block; text-align: center; padding: 10px 0; border: 1.5px solid var(--color-navy); border-radius: 4px; font-weight: 600; color: var(--color-navy); }
  .prapen-scale input:checked + span { background: var(--color-navy); color: var(--color-paper); }
  .prapen-scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--color-ink-soft); margin-top: 4px; }
  .prapen-thanks { text-align: center; padding: 20px 6px; }
  .prapen-sub { margin: 8px 0 2px; font-size: 12.5px; font-weight: 600; color: var(--color-ink-soft); }
  .prapen-list { margin: 0 0 6px; padding-left: 18px; font-size: 12.5px; line-height: 1.5; color: var(--color-ink-soft); }
  .prapen-lang { background: none; border: 1px solid var(--color-brass); color: var(--color-brass); border-radius: 20px; padding: 3px 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; margin-right: 26px; }
  body.prapen-noscroll { overflow: hidden; }

  /* ---------- Finance & Persetujuan ---------- */
  #app.wide { max-width: 1180px; }
  .fin-tablewrap { overflow-x: auto; margin-top: 8px; }
  .fin-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  .fin-table th, .fin-table td { border: 1px solid #E5DECB; padding: 6px 8px; text-align: left; vertical-align: top; }
  .fin-table th { background: #F1EBDA; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  .fin-table .num { text-align: right; white-space: nowrap; }
  .fin-table .nowrap { white-space: nowrap; }
  .fin-table .no-copy { user-select: none; -webkit-user-select: none; }
  .fin-table tr.fin-lunas td { background: #F1F8F3; }
  .fin-table tr.fin-tidak td { background: #FBF0EE; }
  .fin-st { font-weight: 600; }
  .fin-st-lunas { color: #2E7D5B; }
  .fin-st-tidak { color: #B4453A; }
  .fin-btn { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: 1px solid; cursor: pointer; background: #fff; font-family: inherit; }
  .fin-btn:disabled { opacity: .4; cursor: default; }
  .fin-ok { background: #2E7D5B; border-color: #2E7D5B; color: #fff; }
  .fin-no { border-color: #B4453A; color: #B4453A; }
  .fin-row { padding: 12px 14px; }
  .fin-name { margin: 6px 0 4px; font-weight: 600; }
  .fin-check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .fin-actions { display: flex; gap: 8px; margin-top: 10px; }
  .fin-actions button { flex: 1; width: auto; margin: 0; padding: 9px 10px; }
  .bulk-bar { position: sticky; bottom: 8px; margin-top: 12px; z-index: 5; }
  .bulk-bar button { box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .bulk-bar button:disabled { opacity: .55; }

  /* ---------- Cetak Surat (kop + TTD + cap) ---------- */
  .cetak-details { margin-top: 12px; border: 1px solid #E5DECB; border-radius: 10px; padding: 8px 12px; }
  .cetak-details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .cetak-asset { margin-top: 10px; }
  .cetak-asset-box { min-height: 60px; border: 1px dashed #C9C0A8; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 6px; margin-bottom: 6px; background: repeating-conic-gradient(#f4f1e8 0% 25%, #fff 0% 50%) 50% / 14px 14px; }
  .cetak-asset-box img { max-height: 90px; max-width: 100%; }
  #cetakOverlay { position: fixed; inset: 0; z-index: 9999; background: #4a4a4a; overflow: auto; padding-bottom: 24px; }
  .cetak-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 10px 12px; background: #1f1f1f; color: #fff; font-size: 13px; }
  .cetak-bar label { display: inline-flex; gap: 4px; align-items: center; }
  .cetak-tip { flex-basis: 100%; text-align: center; font-size: 11.5px; opacity: .75; }
  .cs-sheet { background: #fff; color: #000; width: 210mm; height: 296.7mm; margin: 16px auto; display: flex; flex-direction: column; font-family: 'Times New Roman', Times, 'Liberation Serif', serif; font-size: 12pt; line-height: 1.3; box-shadow: 0 2px 14px rgba(0,0,0,.4); overflow: hidden; }
  .cs-head { text-align: center; padding-top: 9mm; }
  .cs-head img { width: 78mm; height: auto; }
  .cs-content { padding: 8mm 25.4mm 0; }
  .cs-gap { height: 3.2mm; }
  .cs-line { text-align: justify; }
  .cs-title { text-align: center; font-weight: 700; text-decoration: underline; font-size: 13pt; margin-top: 2mm; }
  .cs-nomor { text-align: center; }
  .cs-tgl { text-align: right; }
  .cs-kv { display: grid; grid-template-columns: 56mm 4mm 1fr; row-gap: .6mm; margin-left: 2mm; }
  .cs-sign { margin-top: 2mm; break-inside: avoid; }
  .cs-sigspace { position: relative; height: 18mm; }
  .cs-ttd { position: absolute; left: 2mm; top: 0; max-height: 18mm; max-width: 45mm; }
  .cs-cap { position: absolute; left: -16mm; top: -4mm; max-height: 28mm; max-width: 28mm; mix-blend-mode: multiply; }
  .cs-name { font-weight: 700; text-decoration: underline; }
  .cs-foot { margin-top: auto; text-align: center; font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.3; padding-bottom: 0; }
  .cs-foot-t { font-weight: 700; color: #0F7071; }
  .cs-bar { height: 4.6mm; background: #0F7071; margin-top: 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen and (max-width: 860px) { .cs-sheet { zoom: .42; margin: 8px auto; } }
  .cs-render { position: fixed; left: -12000px; top: 0; z-index: -1; pointer-events: none; }
  .cs-render .cs-sheet { zoom: 1 !important; margin: 0 !important; box-shadow: none !important; }
  @media print {
    @page { size: A4; margin: 0; }
    body.cetak-mode { background: #fff !important; }
    body.cetak-mode > *:not(#cetakOverlay) { display: none !important; }
    #cetakOverlay { position: static; background: none; overflow: visible; padding: 0; }
    .cetak-bar { display: none !important; }
    .cs-sheet { margin: 0; box-shadow: none; zoom: 1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  .klinik-theme { --color-navy: #0E6B5C; }
  .klinik-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--color-ink-soft); text-transform: uppercase; }
  .klinik-alert-card { background: var(--color-navy); border-left: none; color: #FFFFFF; }
  .klinik-alert-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .klinik-alert-badge { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .klinik-alert-time { font-size: 10.5px; color: rgba(255,255,255,0.75); }
  .klinik-alert-name { font-size: 17px; font-weight: 700; font-family: var(--font-display); margin-bottom: 2px; }
  .klinik-alert-sub { font-size: 12.5px; color: rgba(255,255,255,0.8); margin-bottom: 10px; }
  .klinik-alert-body { background: rgba(255,255,255,0.12); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; line-height: 1.7; margin-bottom: 12px; }
  .klinik-alert-card .btn-primary { background: #FFFFFF; color: var(--color-navy); }
  .klinik-alert-card .field-input { background: rgba(255,255,255,0.14); color: #FFFFFF; border-bottom-color: rgba(255,255,255,0.4); border-radius: 4px; padding: 8px 10px; }
  .klinik-alert-card .field-input::placeholder { color: rgba(255,255,255,0.55); }
  .klinik-alert-card .field-input:focus { border-bottom-color: #FFFFFF; }
  .klinik-alert-card .req-id-small { color: #FFFFFF; font-weight: 600; }
  .klinik-alert-card .btn-outline { color: #FFFFFF; border-color: rgba(255,255,255,0.6); background: transparent; }
  .klinik-alert-card .btn-outline.active { background: #FFFFFF; color: var(--color-navy); border-color: #FFFFFF; }
  .klinik-alert-card .field-error, .klinik-alert-card .req { color: #FFD1CC; }

  #klinikIdleOverlay {
    position: fixed; inset: 0; background: var(--color-navy); color: #FFFFFF; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .klinik-idle-icon { font-size: 26px; margin-bottom: 14px; opacity: 0.8; }
  .klinik-idle-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; font-family: var(--font-display); }
  .klinik-idle-sub { font-size: 13px; color: rgba(255,255,255,0.7); max-width: 260px; line-height: 1.6; margin-bottom: 22px; }
  .klinik-idle-count { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 8px 16px; margin-bottom: 26px; font-size: 12.5px; font-weight: 600; }
  .klinik-idle-wake { padding: 13px 28px; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13.5px; font-weight: 700; }

  .type-card {
    display: flex; flex-direction: column; gap: 6px; text-align: left;
    background: var(--color-card); border: none; border-left: 3px solid var(--color-navy);
    border-radius: 4px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(27,42,74,0.08);
    font-family: var(--font-body); width: 100%;
  }
  .type-card:hover { border-left-color: var(--color-brass); }
  .type-card-label { font-family: var(--font-display); font-size: 15.5px; color: var(--color-navy); font-weight: 600; }
  .type-card-desc { font-size: 12.5px; color: var(--color-ink-soft); line-height: 1.45; }
  .type-card-fee { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-brass); margin-top: 2px; }

  .btn-primary {
    background: var(--color-navy); color: var(--color-paper); border: none; border-radius: 4px;
    padding: 14px 20px; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; width: 100%;
  }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-outline {
    background: transparent; color: var(--color-navy); border: 1.5px solid var(--color-navy);
    border-radius: 4px; padding: 13px 20px; font-size: 15px; font-weight: 600; width: 100%;
  }
  .btn-outline.active { background: var(--color-navy); color: var(--color-paper); }
  .btn-text { background: none; border: none; color: var(--color-ink-soft); font-size: 14px; text-decoration: underline; padding: 8px; width: 100%; }
  .btn-text.danger { color: var(--color-red); }

  .back-btn { background: none; border: none; color: var(--color-ink-soft); font-size: 13px; padding: 0; margin-bottom: 18px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .top-row .back-btn { margin-bottom: 0; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .field-label { font-size: 12px; letter-spacing: 0.3px; color: var(--color-ink-soft); text-transform: uppercase; }
  .req { color: var(--color-red); }
  .field-input {
    border: none; border-bottom: 2px solid #D8D2C4; background: transparent; padding: 8px 2px;
    font-family: var(--font-body); font-size: 15px; color: var(--color-ink); outline: none; width: 100%;
  }
  .field-input:focus { border-bottom-color: var(--color-brass); }
  textarea.field-input { resize: vertical; min-height: 60px; }
  select.field-input { border: 1px solid #D8D2C4; border-radius: 4px; padding: 10px; background: var(--color-card); }
  .field-error { color: var(--color-red); font-size: 12px; }

  .checkbox-field { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; }
  .checkbox-field input { width: 18px; height: 18px; flex-shrink: 0; }

  .hint { font-size: 13px; color: var(--color-ink-soft); line-height: 1.55; }
  .hint.center { text-align: center; }

  .stamp {
    display: inline-block; padding: 5px 14px; border: 2px dashed currentColor;
    border-radius: 50% / 40%; transform: rotate(-3deg); font-family: var(--font-mono);
    font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; margin: 8px 0;
  }
  .stamp.baru { color: var(--color-red); }
  .stamp.pembayaran_belum_diterima { color: var(--color-red); }
  .stamp.lunas { color: var(--color-brass); }
  .stamp.selesai { color: var(--color-green); }
  .stamp.diproses { color: var(--color-brass); }
  .stamp.link_bermasalah { color: var(--color-brass); }
  .stamp.ditolak { color: var(--color-red); }

  .req-id { font-family: var(--font-mono); font-size: 19px; color: var(--color-navy); font-weight: 600; margin: 6px 0; cursor: pointer; display: inline-block; }

  var GURU_STATUS_RANK = { link_bermasalah: 0, baru: 1, diproses: 2 };
  function computeOverallGuruStatus(data, fallbackStatus) {
    var slots = guruSlotsFor(data);
    if (slots.length === 0) return fallbackStatus || 'baru';
    var statuses = slots.map(function (n) { return guruStatusAt(data, n, fallbackStatus); });
    var allResolved = statuses.every(function (st) { return st === 'selesai' || st === 'ditolak'; });
    if (allResolved) {
      return statuses.every(function (st) { return st === 'ditolak'; }) ? 'ditolak' : 'selesai';
    }
    var pending = statuses.filter(function (st) { return st !== 'selesai' && st !== 'ditolak'; });
    pending.sort(function (a, b) { return (GURU_STATUS_RANK[a] || 0) - (GURU_STATUS_RANK[b] || 0); });

  function formatDuration(ms) {
    var hours = ms / (1000 * 60 * 60);
    if (hours < 24) return Math.max(1, Math.round(hours)) + ' jam';
    return (Math.round((hours / 24) * 10) / 10) + ' hari';
  }
  function estimateDays(submittedIso, tanggalSurat) {
    var start = new Date(submittedIso); start.setHours(0, 0, 0, 0);
    var end = new Date(tanggalSurat + 'T00:00:00');
    var days = Math.round((end - start) / 86400000);
    return days <= 0 ? '± di hari yang sama' : '± ' + days + ' hari';
  }
  function formatDurationLong(ms, en) {
    if (!(ms >= 0)) return '';
    var minutes = Math.round(ms / 60000);
    if (minutes < 1) return en ? 'less than 1 minute' : 'kurang dari 1 menit';
    var days = Math.floor(minutes / 1440);
    var hours = Math.floor((minutes % 1440) / 60);
    var mins = minutes % 60;
    var parts = [];
    if (days) parts.push(days + (en ? (days > 1 ? ' days' : ' day') : ' hari'));
    if (hours) parts.push(hours + (en ? (hours > 1 ? ' hours' : ' hour') : ' jam'));
    if (mins && days === 0) parts.push(mins + (en ? (mins > 1 ? ' minutes' : ' minute') : ' menit'));
    return parts.join(' ');
  }

      if (res.error) return { ok: false, error: res.error.message };
      return { ok: true };
    } catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }
  }

    try {
      var res = await sb.rpc('submit_feedback', { request_id: id, rating: rating || null, message: message || '' });
      if (res.error) return { ok: false, error: res.error.message };
      return { ok: true };
    } catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }
  }
  async function fixRekomendasiLink(id, newLink) {
    try {
      var res = await sb.rpc('fix_rekomendasi_link', { request_id: id, new_link: newLink });
      if (res.error) return { ok: false, error: res.error.message };
      return { ok: true };
    } catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }
  }
  async function updateAdminPassword(password) {
    try {
      var res = await sb.auth.updateUser({ password: password });
      if (res.error) return { ok: false, error: res.error.message };
      return { ok: true };
    } catch (e) { return { ok: false, error: (e && e.message) ? e.message : String(e) }; }
  }
  async function hasAdminSession() {
    try {
      var res = await sb.auth.getSession();
      return !!(res && res.data && res.data.session);
    } catch (e) { return false; }
  }
  async function getCurrentRole() {
    try {
      var res = await sb.auth.getSession();
      var session = res && res.data && res.data.session;
      if (!session) return null;
      return (session.user && session.user.user_metadata && session.user.user_metadata.role) || 'admin';
    } catch (e) { return 'admin'; }

  function dashboardViewFor(role) {
    if (role === 'guru') return 'guruDashboard';
    if (role === 'dormparent') return 'klinikForm';
    if (role === 'klinik') return 'klinikDashboard';
    if (role === 'finance') return 'financeDashboard';
    return 'adminDashboard';
  }

  function go(view, extra) {
    S.view = view;
    if (extra) Object.assign(S, extra);
    render();
    window.scrollTo(0, 0);
  }
  function backBar(view, label) {
    return '<button class="back-btn" data-go="' + view + '">‹ ' + escapeHtml(label) + '</button>';
  }

  function render() {
    var app = document.getElementById('app');
    if (S.loading) { app.innerHTML = renderLoading(); return; }
    var html = '';
    switch (S.view) {
      case 'home': html = renderHome(); break;
      case 'pilihJenis': html = renderPilihJenis(); break;
      case 'form': html = renderForm(); break;
      case 'pembayaran': html = renderPembayaran(); break;
      case 'konfirmasi': html = renderKonfirmasi(); break;
      case 'cekStatus': html = renderCekStatus(); break;
      case 'adminGate': html = renderAdminGate(); break;
      case 'adminResetPassword': html = renderAdminResetPassword(); break;
      case 'adminDashboard': html = renderAdminDashboard(); break;
      case 'guruDashboard': html = renderGuruDashboard(); break;
      case 'guruSiswa': html = renderGuruSiswa(); break;
      case 'siswaGuru': html = renderSiswaGuru(); break;
      case 'feedbackList': html = renderFeedbackList(); break;
      case 'klinikForm': html = renderKlinikForm(); break;
      case 'klinikSlip': html = renderKlinikSlip(); break;
      case 'klinikDashboard': html = renderKlinikDashboard(); break;
      case 'financeDashboard': html = S.userRole === 'finance' ? renderFinanceDashboard() : renderAdminDashboard(); break;
      case 'adminDetail':
        var detailReq = S.requests.find(function (r) { return r.id === S.adminSelectedId; });
        if (S.userRole === 'finance') {
          S.view = 'financeDashboard'; html = renderFinanceDashboard();
        } else if (!detailReq || (S.userRole === 'guru' && detailReq.type !== 'REKOMENDASI')) {
          S.view = S.userRole === 'guru' ? 'guruDashboard' : 'adminDashboard';
          html = S.userRole === 'guru' ? renderGuruDashboard() : renderAdminDashboard();
        } else {
          html = renderAdminDetail();
        }
        break;
      default: html = renderHome();
    }
    if (STUDENT_VIEWS.indexOf(S.view) !== -1) html = renderLangToggle() + html;
    app.innerHTML = html;
    app.classList.toggle('wide', S.view === 'financeDashboard' && S.userRole === 'finance');
    attachHandlers();
  }

  function renderForm() {
    var t = LETTER_TYPES[S.selectedType];
    if (!t) return renderPilihJenis();
    var fieldsHtml = t.fields.map(function (f) {
      var val = escapeHtml((S.formDraft && S.formDraft[f.key]) || '');
      var err = S.formErrors[f.key] ? '<span class="field-error">' + escapeHtml(S.formErrors[f.key]) + '</span>' : '';
      var inputEl;
      if (f.type === 'textarea') {
        inputEl = '<textarea class="field-input" data-field="' + f.key + '" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" rows="2">' + val + '</textarea>';
      } else if (f.type === 'select') {
        var groups = {}; var groupOrder = [];
        f.options.forEach(function (o) {
          var g = o.group || '';
          if (groups[g] === undefined) { groups[g] = []; groupOrder.push(g); }
          groups[g].push(o);
        });
        var opts = groupOrder.map(function (g) {
          var inner = groups[g].map(function (o) {
            return '<option value="' + escapeHtml(o.value) + '"' + ((S.formDraft && S.formDraft[f.key]) === o.value ? ' selected' : '') + '>' + escapeHtml(optionLabel(o)) + '</option>';
          }).join('');
          return g ? ('<optgroup label="' + escapeHtml(g) + '">' + inner + '</optgroup>') : inner;
        }).join('');
        inputEl = '<select class="field-input" data-field="' + f.key + '"><option value="">' + escapeHtml(tt('pilihOpsi')) + '</option>' + opts + '</select>';
      } else if (f.type === 'date') {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="date" value="' + val + '">';
      } else if (f.type === 'email') {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="email" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" value="' + val + '">';
      } else {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="text" placeholder="' + escapeHtml(fieldPlaceholder(f)) + '" value="' + val + '">';
      }
      var fieldHint = f.hint ? '<span class="hint">' + escapeHtml(S.lang === 'en' ? (f.hintEn || f.hint) : f.hint) + '</span>' : '';
      return '<label class="field">' +
        '<span class="field-label">' + escapeHtml(fieldLabel(f)) + (f.required ? ' <span class="req">*</span>' : '') + '</span>' +
        inputEl + fieldHint + err +
      '</label>';
    }).join('');
    var noticeHtml = t.notice ? '<div class="notice-card">' + escapeHtml(S.lang === 'en' ? (t.noticeEn || t.notice) : t.notice) + '</div>' : '';
    var downloadHtml = t.downloadFile ? '<div class="info-card"><a href="' + t.downloadFile + '" target="_blank" style="color:var(--color-navy);font-weight:600;text-decoration:none;">↓ ' + escapeHtml(S.lang === 'en' ? t.downloadLabelEn : t.downloadLabel) + '</a></div>' : '';
    var introHtml = t.intro ? '<p class="hint">' + escapeHtml(S.lang === 'en' ? (t.introEn || t.intro) : t.intro) + '</p>' : '';
    var submitLabel = t.noPayment ? tt('kirimPermintaan') : tt('lanjutPembayaran');
    return backBar(t.hideFromMenu ? 'home' : 'pilihJenis', t.hideFromMenu ? tt('beranda') : tt('jenisSurat')) +
      '<h2>' + escapeHtml(typeLabel(t)) + '</h2>' +
      introHtml +
      '<p class="hint">' + escapeHtml(tt('formHint')) + '</p>' +
      downloadHtml +
      noticeHtml +
      '<form id="dataForm" class="stack">' + fieldsHtml + '<button type="submit" class="btn-primary">' + escapeHtml(submitLabel) + '</button></form>';
  }

  function feedbackSummaryHtml(list, scope) {

    '</div>';

  function renderRekomendasiBody() {
    var rekomRequests = S.requests.filter(function (r) { return r.type === 'REKOMENDASI'; });
    var filtered = rekomRequests.filter(function (r) {
      if (S.guruFilterStatus !== 'all' && r.status !== S.guruFilterStatus) return false;
      return true;
    }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });

    var total = rekomRequests.length;
    var guruEntries = guruSlotEntries(rekomRequests);
    var menunggu = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'menunggu'; }).length;
    var diproses = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'diproses'; }).length;
    var selesai = guruEntries.filter(function (e) { return guruStatBucket(e.status) === 'selesai'; }).length;

    var statDetailHtml = '';
    if (S.guruStatFilter) {
      var matching = guruEntries.filter(function (e) { return guruStatBucket(e.status) === S.guruStatFilter; })
        .sort(function (a, b) {
          var ad = a.completedAt || a.req.submittedAt;
          var bd = b.completedAt || b.req.submittedAt;
          return new Date(bd) - new Date(ad);
        });
      var statLabel = { menunggu: 'Guru Menunggu', diproses: 'Guru Diproses', selesai: 'Guru Selesai' }[S.guruStatFilter];
      var rowsHtml = matching.map(function (e) {
        var timingHtml;
        if ((e.status === 'selesai' || e.status === 'ditolak') && e.completedAt) {
          var deltaMs = new Date(e.completedAt).getTime() - new Date(e.req.submittedAt).getTime();
          timingHtml = 'Diajukan ' + escapeHtml(formatDateShort(e.req.submittedAt)) + ' &rarr; ' + escapeHtml(statusLabelFor('REKOMENDASI', e.status)) + ' ' + escapeHtml(formatDateTimeFull(e.completedAt)) + (deltaMs >= 0 ? ' (' + escapeHtml(formatDuration(deltaMs)) + ')' : '');
        } else {
          timingHtml = 'Diajukan ' + escapeHtml(formatDateShort(e.req.submittedAt)) + ' &middot; ' + escapeHtml(statusLabelFor('REKOMENDASI', e.status));
        }
        var noteHtml = e.note ? '<div class="hint" style="margin-top:2px;">Catatan: ' + escapeHtml(e.note) + '</div>' : '';
        return '<button class="card list-item" data-detail="' + e.req.id + '">' +
          '<div class="list-item-top"><span>' + escapeHtml(e.name) + '</span><span class="req-id-small" title="Klik untuk salin kode">' + escapeHtml(e.req.id) + '</span></div>' +
          '<div class="list-item-bottom"><span>' + escapeHtml(e.req.data.namaLengkap || '-') + '</span></div>' +
          '<div class="hint" style="margin-top:4px;">' + timingHtml + '</div>' +
          noteHtml +
        '</button>';
      }).join('') || '<p class="hint">Belum ada.</p>';
      statDetailHtml = '<div class="stat-block"><p class="stat-block-title">Detail ' + escapeHtml(statLabel) + '</p>' + rowsHtml + '</div>';
    }

    var byGuru = tallyByMulti(rekomRequests, function (r) { return guruNamesFor(r.data); });
    var bySiswa = tallyBy(rekomRequests, function (r) { return r.data.namaLengkap; });
    var byUniv = tallyBy(rekomRequests, function (r) { return r.data.keperluan; });

    var rows = filtered.map(function (r) {
      var guruLinesHtml = guruSlotsFor(r.data).map(function (n) {
        var name = guruNameAt(r.data, n);
        var st = guruStatusAt(r.data, n, r.status);
        var completedAt = guruCompletedAtAt(r.data, n);
        var line = escapeHtml(name) + ': ' + escapeHtml(statusLabelFor('REKOMENDASI', st));
        if (st === 'selesai' && completedAt) line += ' (' + escapeHtml(formatDateShort(completedAt)) + ')';
        return '<div class="hint" style="margin-top:2px;">' + line + '</div>';
      }).join('');
      return '<button class="card list-item" data-detail="' + r.id + '">' +
        '<div class="list-item-top">' +
          '<span class="req-id-small" title="Klik untuk salin kode">' + escapeHtml(r.id) + '</span>' +
          '<span class="stamp ' + r.status + '">' + escapeHtml(statusLabelFor(r.type, r.status)) + '</span>' +
        '</div>' +
        '<div class="list-item-bottom">' +
          '<span>' + escapeHtml(r.data.namaLengkap || '-') + '</span>' +
          '<span>' + escapeHtml(formatDateShortAdmin(r.submittedAt)) + '</span>' +
        '</div>' +
        guruLinesHtml +
      '</button>';
    }).join('') || '<p class="hint">Belum ada permintaan untuk filter ini.</p>';

    return '' +
      '<div class="stats-grid">' +
        '<div class="stat"><span class="stat-num">' + total + '</span><span class="stat-label">Total Permintaan</span></div>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'menunggu' ? ' active' : '') + '" data-statfilter="menunggu"><span class="stat-num">' + menunggu + '</span><span class="stat-label">Guru Menunggu</span></button>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'diproses' ? ' active' : '') + '" data-statfilter="diproses"><span class="stat-num">' + diproses + '</span><span class="stat-label">Guru Diproses</span></button>' +
        '<button class="stat stat-clickable' + (S.guruStatFilter === 'selesai' ? ' active' : '') + '" data-statfilter="selesai"><span class="stat-num">' + selesai + '</span><span class="stat-label">Guru Selesai</span></button>' +
      '</div>' +
      '<p class="hint" style="margin-top:-8px;">Klik salah satu angka guru di atas untuk lihat rinciannya.</p>' +
      feedbackSummaryHtml(rekomRequests, 'rekom') +
      statDetailHtml +
      '<div class="stat-block"><p class="stat-block-title">Rekap Guru</p>' +
        (byGuru.length === 0 ? '<p class="hint">Belum ada data.</p>' : '<p class="hint" style="margin-top:-6px;">Klik nama guru untuk lihat siswa yang memintanya.</p><div class="recap-list">' + byGuru.map(function (item, idx) {
          return '<button type="button" class="recap-row recap-click" data-gururecap="' + escapeHtml(item.label) + '">' +
            '<span class="recap-dot" style="background:' + CHART_COLORS[idx % CHART_COLORS.length] + '"></span>' +
            '<span class="recap-label" title="' + escapeHtml(item.label) + '">' + escapeHtml(item.label) + '</span>' +
            '<span class="recap-count">' + item.count + '</span></button>';
        }).join('') + '</div>') +
      '</div>' +
      '<div class="stat-block"><p class="stat-block-title">Rekap Siswa</p>' +
        (bySiswa.length === 0 ? '<p class="hint">Belum ada data.</p>' : '<p class="hint" style="margin-top:-6px;">Klik nama siswa untuk lihat guru yang diminta.</p><div class="recap-list">' + bySiswa.map(function (item, idx) {
          return '<button type="button" class="recap-row recap-click" data-siswarecap="' + escapeHtml(item.label) + '">' +
            '<span class="recap-dot" style="background:' + CHART_COLORS[idx % CHART_COLORS.length] + '"></span>' +
            '<span class="recap-label" title="' + escapeHtml(item.label) + '">' + escapeHtml(item.label) + '</span>' +
            '<span class="recap-count">' + item.count + '</span></button>';
        }).join('') + '</div>') +
      '</div>' +
      '<div class="stat-block"><p class="stat-block-title">Rekap Univ</p>' + renderRecapList(byUniv) + '</div>' +
      '<div class="filter-row">' +
        '<select id="guruFilterStatus" class="field-input">' +
          '<option value="all"' + (S.guruFilterStatus === 'all' ? ' selected' : '') + '>Semua Status</option>' +
          '<option value="baru"' + (S.guruFilterStatus === 'baru' ? ' selected' : '') + '>Menunggu Diproses</option>' +
          '<option value="diproses"' + (S.guruFilterStatus === 'diproses' ? ' selected' : '') + '>Diproses</option>' +
          '<option value="link_bermasalah"' + (S.guruFilterStatus === 'link_bermasalah' ? ' selected' : '') + '>Link Bermasalah</option>' +
          '<option value="selesai"' + (S.guruFilterStatus === 'selesai' ? ' selected' : '') + '>Selesai</option>' +
          '<option value="ditolak"' + (S.guruFilterStatus === 'ditolak' ? ' selected' : '') + '>Ditolak</option>' +
        '</select>' +
      '</div>' +
      '<div class="stack">' + rows + '</div>' +
      '<button class="btn-outline" id="exportRekomendasiBtn" style="margin-top:12px">Export Arsip Rekomendasi (CSV)</button>';
  }

    document.querySelectorAll('[data-statfilter]').forEach(function (btn) {

  function renderGuruSiswa() {
    var selName = String(S.guruRekapSelected || '').trim();
    var rekomRequests = S.requests.filter(function (r) { return r.type === 'REKOMENDASI'; });
    var asked = rekomRequests.filter(function (r) {
      return guruNamesFor(r.data).some(function (n) { return String(n).trim() === selName; });
    }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });
    function statusOf(r) {
      var d = r.data || {};
      var slot = guruSlotsFor(d).filter(function (n) { return String(guruNameAt(d, n)).trim() === selName; })[0];
      return { slot: slot, st: guruStatusAt(d, slot, r.status) };
    }
    var menunggu = asked.filter(function (r) { return guruStatBucket(statusOf(r).st) === 'menunggu'; }).length;
    var diproses = asked.filter(function (r) { return guruStatBucket(statusOf(r).st) === 'diproses'; }).length;
    var selesai = asked.filter(function (r) { return guruStatBucket(statusOf(r).st) === 'selesai'; }).length;
    var rows = asked.map(function (r) {
      var d = r.data || {};
      var info = statusOf(r);
      var others = guruSlotsFor(d).filter(function (n) { return n !== info.slot; }).map(function (n) { return guruNameAt(d, n); });
      return '<button class="card list-item" data-detail="' + r.id + '">' +
        '<div class="list-item-top"><span>' + escapeHtml(d.namaLengkap || '-') + (d.kelas ? ' &middot; ' + escapeHtml(d.kelas) : '') + '</span><span class="stamp ' + info.st + '">' + escapeHtml(statusLabelFor('REKOMENDASI', info.st)) + '</span></div>' +
        '<div class="list-item-bottom"><span>' + escapeHtml(d.keperluan || '-') + '</span><span>' + escapeHtml(formatDateShortAdmin(r.submittedAt)) + '</span></div>' +
        (others.length ? '<div class="hint" style="margin-top:4px;">Guru lain: ' + escapeHtml(others.join(', ')) + '</div>' : '') +
      '</button>';
    }).join('') || '<p class="hint">Belum ada siswa yang meminta guru ini.</p>';
    return backBar(dashboardViewFor(S.userRole), 'Dashboard') +
      '<h2>' + escapeHtml(selName) + '</h2>' +
      '<p class="hint">Siswa yang meminta rekomendasi dari guru ini (' + asked.length + ').</p>' +
      '<div class="stats-grid">' +
        '<div class="stat"><span class="stat-num">' + asked.length + '</span><span class="stat-label">Total Diminta</span></div>' +
        '<div class="stat"><span class="stat-num">' + menunggu + '</span><span class="stat-label">Menunggu</span></div>' +
        '<div class="stat"><span class="stat-num">' + diproses + '</span><span class="stat-label">Diproses</span></div>' +
        '<div class="stat"><span class="stat-num">' + selesai + '</span><span class="stat-label">Selesai</span></div>' +
      '</div>' +
      '<div class="stack">' + rows + '</div>';

        inputEl = '<textarea class="field-input" data-field="' + f.key + '" placeholder="' + escapeHtml(f.placeholder || '') + '" rows="2">' + val + '</textarea>';
      } else {
        inputEl = '<input class="field-input" data-field="' + f.key + '" type="text" placeholder="' + escapeHtml(f.placeholder || '') + '" value="' + val + '">';
      }

      '<form id="klinikDataForm" class="stack">' +
        t.fields.map(field).join('') +

      '</form>'
    );

  function attachKlinikForm() {
    document.getElementById('klinikLogoutBtn').addEventListener('click', klinikLogoutHandler());
    document.querySelectorAll('[data-dormparenttab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        S.dormparentTab = btn.getAttribute('data-dormparenttab');
        render();
      });
    });
    var dpExportBtn = document.getElementById('exportKlinikBtn');
    if (dpExportBtn && S.dormparentTab !== 'stats') dpExportBtn.addEventListener('click', downloadKlinikExcel);
    if (S.dormparentTab === 'stats') {
      attachKlinikDashboardBody();
      return;
    }
    document.querySelectorAll('#klinikDataForm .field-input').forEach(function (inp) {
      var handler = function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[inp.getAttribute('data-field')] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    document.querySelectorAll('#klinikDataForm [data-toggle-field]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[btn.getAttribute('data-toggle-field')] = btn.getAttribute('data-toggle-value');
        render();
      });
    });
    document.getElementById('klinikDataForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var t = LETTER_TYPES.IZIN_KLINIK;
      var errors = {};
      t.fields.forEach(function (f) {
        if (f.required && !(S.formDraft[f.key] && String(S.formDraft[f.key]).trim())) errors[f.key] = tt('fieldWajib');
      });
      S.klinikErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Mengirim...';
      var newReq = {
        id: generateId('IZIN_KLINIK'), type: 'IZIN_KLINIK', submittedAt: new Date().toISOString(), status: 'baru',
        paymentChecked: false, paymentNote: '', paymentDate: null, paymentCode: null, amount: 0,
        adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
        data: Object.assign({}, S.formDraft)
      };
      var result = await insertRequest(newReq);
      if (!result.ok) {
        alert('Gagal mengirim: ' + result.error);
        submitBtn.disabled = false; submitBtn.textContent = 'Kirim & Terbitkan Izin';
        return;
      }
      S.requests = (S.requests || []).concat([newReq]);
      S.lastRequest = newReq;
      S.formDraft = {}; S.klinikErrors = {};
      go('klinikSlip');
    });
  }

  function renderKlinikKeputusanRecap() {
    var klinikRequests = S.requests.filter(function (r) { return r.type === 'IZIN_KLINIK'; });
    var todayStr = todayISO();
    var groups = { kelas: [], istirahat: [], pulang: [] };
    klinikRequests.forEach(function (r) {
      var d = r.data || {};
      if (r.status === 'selesai' && groups[d.keputusan] && d.completedAt && String(d.completedAt).slice(0, 10) === todayStr) {
        groups[d.keputusan].push(r);
      }
    });
    var menunggu = klinikRequests.filter(function (r) { return r.status !== 'selesai'; });

    var countsHtml = '<div class="stats-grid">' +
      KLINIK_KEPUTUSAN.map(function (k) {
        return '<div class="stat"><span class="stat-num">' + groups[k.value].length + '</span><span class="stat-label">' + escapeHtml(k.short) + '</span></div>';
      }).join('') +
      '<div class="stat"><span class="stat-num">' + menunggu.length + '</span><span class="stat-label">Belum Diperiksa</span></div>' +
    '</div>';

    function rowsFor(list, color, showRest) {
      if (list.length === 0) return '<p class="hint">Tidak ada.</p>';
      return '<div class="recap-list">' + list.map(function (r) {
        var d = r.data || {};
        return '<div class="recap-row">' +
          '<span class="recap-dot" style="background:' + color + '"></span>' +
          '<span class="recap-label" style="white-space:normal;">' + escapeHtml(d.namaSiswa || '-') + ' &middot; ' + escapeHtml(klinikKelasAsramaText(d)) +
            (showRest && d.lamaIstirahat ? ' &mdash; ' + escapeHtml(d.lamaIstirahat) : '') + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }

    var blocks = KLINIK_KEPUTUSAN.map(function (k) {
      return '<div class="stat-block"><p class="stat-block-title">' + escapeHtml(k.label) + ' (' + groups[k.value].length + ')</p>' +
        rowsFor(groups[k.value], k.color, k.value !== 'kelas') + '</div>';
    }).join('');
    blocks += '<div class="stat-block"><p class="stat-block-title">Belum Diperiksa / Menunggu (' + menunggu.length + ')</p>' +
      rowsFor(menunggu, '#6B6560', false) + '</div>';

    return '<div class="section-label">Rekap Keputusan Klinik &mdash; Hari Ini</div>' + countsHtml + blocks;
  }

  function renderKlinikDashboardBody(opts) {
    opts = opts || {};
    var klinikRequests = S.requests.filter(function (r) { return r.type === 'IZIN_KLINIK'; });
    var pending = klinikRequests.filter(function (r) { return r.status !== 'selesai'; })
      .sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });
    var selesaiSemua = klinikRequests.filter(function (r) { return r.status === 'selesai'; });
    var todayStr = todayISO();
    var historyToday = selesaiSemua.filter(function (r) {
      return r.data && r.data.completedAt && String(r.data.completedAt).slice(0, 10) === todayStr;
    }).sort(function (a, b) { return new Date(b.data.completedAt) - new Date(a.data.completedAt); });

    var statsHtml = '<div class="stats-grid">' +
      '<div class="stat"><span class="stat-num">' + klinikRequests.length + '</span><span class="stat-label">Total Pengajuan</span></div>' +
      '<button class="stat stat-clickable' + (S.klinikStatFilter === 'menunggu' ? ' active' : '') + '" data-klinikstatfilter="menunggu"><span class="stat-num">' + pending.length + '</span><span class="stat-label">Menunggu</span></button>' +
      '<button class="stat stat-clickable' + (S.klinikStatFilter === 'selesai' ? ' active' : '') + '" data-klinikstatfilter="selesai"><span class="stat-num">' + selesaiSemua.length + '</span><span class="stat-label">Sudah Ditandai Klinik</span></button>' +
    '</div>';

    function klinikTreatmentSummary(d) {
      if (!(d.keputusan || d.diagnosa || d.lamaIstirahat || d.jenisObat || d.catatanKlinik)) return '';
      return '<div class="hint" style="margin-top:6px;line-height:1.6;">' +
        (d.keputusan ? '<strong>Keputusan:</strong> ' + escapeHtml(keputusanLabel(d.keputusan)) + '<br>' : '') +
        (d.diagnosa ?'<strong>Diagnosa:</strong> ' + escapeHtml(d.diagnosa) + '<br>' : '') +
        (d.lamaIstirahat ? '<strong>Lama Istirahat:</strong> ' + escapeHtml(d.lamaIstirahat) + '<br>' : '') +
        (d.jenisObat ? '<strong>Obat:</strong> ' + escapeHtml(d.jenisObat) + '<br>' : '') +
        (d.catatanKlinik ? '<strong>Catatan Klinik:</strong> ' + escapeHtml(d.catatanKlinik) : '') +
      '</div>';
    }

    var statDetailHtml = '';
    if (S.klinikStatFilter === 'menunggu' || S.klinikStatFilter === 'selesai') {
      var matching = S.klinikStatFilter === 'menunggu' ? pending : selesaiSemua.slice().sort(function (a, b) {
        return new Date((b.data && b.data.completedAt) || b.submittedAt) - new Date((a.data && a.data.completedAt) || a.submittedAt);
      });
      var statLabel = S.klinikStatFilter === 'menunggu' ? 'Menunggu' : 'Sudah Ditandai Klinik';
      var detailRowsHtml = matching.length === 0 ? '<p class="hint">Belum ada.</p>' : matching.map(function (r) {
        var d = r.data || {};
        var timingHtml;
        if (r.status === 'selesai' && d.completedAt) {
          var deltaMs = new Date(d.completedAt).getTime() - new Date(r.submittedAt).getTime();
          timingHtml = 'Diajukan ' + escapeHtml(formatDateShort(r.submittedAt)) + ' &rarr; Selesai ' + escapeHtml(formatDateTimeFull(d.completedAt)) + (deltaMs >= 0 ? ' (' + escapeHtml(formatDuration(deltaMs)) + ')' : '') + (d.petugasKlinik ? ' &middot; ' + escapeHtml(d.petugasKlinik) : '');
        } else {
          timingHtml = 'Diajukan ' + escapeHtml(formatDateTimeFull(r.submittedAt));
        }
        return '<div class="card list-item">' +

  function attachKlinikDashboardBody() {
    var exportKlinikBtn = document.getElementById('exportKlinikBtn');
    if (exportKlinikBtn) exportKlinikBtn.addEventListener('click', downloadKlinikExcel);
    var petugasInput = document.getElementById('klinikPetugasInput');
    if (petugasInput) petugasInput.addEventListener('input', function () { S.klinikPetugas = petugasInput.value; });
    document.querySelectorAll('[data-klinikstatfilter]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-klinikstatfilter');
        S.klinikStatFilter = (S.klinikStatFilter === key) ? null : key;
        render();
      });
    });
    document.querySelectorAll('[data-treatment-field]').forEach(function (inp) {
      var handler = function () {
        var reqId = inp.getAttribute('data-req-id');
        var field = inp.getAttribute('data-treatment-field');
        if (!S.klinikTreatmentDraft[reqId]) S.klinikTreatmentDraft[reqId] = {};
        S.klinikTreatmentDraft[reqId][field] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    document.querySelectorAll('[data-keputusan-req]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var reqId = btn.getAttribute('data-keputusan-req');
        if (!S.klinikTreatmentDraft[reqId]) S.klinikTreatmentDraft[reqId] = {};
        S.klinikTreatmentDraft[reqId].keputusan = btn.getAttribute('data-keputusan-value');
        if (S.klinikTandaiErrors[reqId]) S.klinikTandaiErrors[reqId].keputusan = false;
        render();
      });
    });
    document.querySelectorAll('[data-klinik-selesai]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-klinik-selesai');
        var req = S.requests.find(function (r) { return r.id === id; });
        if (!req) return;
        var keputusanVal = (S.klinikTreatmentDraft[id] || {}).keputusan || '';
        var diagnosaEl = document.getElementById('klinikDiagnosaInput-' + id);
        var lamaIstirahatEl = document.getElementById('klinikLamaIstirahatInput-' + id);
        var obatEl = document.getElementById('klinikObatInput-' + id);
        var catatanEl = document.getElementById('klinikCatatanInput-' + id);

        var petugasVal = (S.klinikPetugas || '').trim();
        var diagnosaVal = diagnosaEl ? diagnosaEl.value.trim() : '';
        var lamaIstirahatVal = lamaIstirahatEl ? lamaIstirahatEl.value.trim() : '';
        var obatVal = obatEl ? obatEl.value.trim() : '';
        var catatanVal = catatanEl ? catatanEl.value.trim() : '';

        S.klinikPetugasError = !petugasVal;
        var fieldErrors = {
          keputusan: !keputusanVal,
          diagnosa: !diagnosaVal,
          lamaIstirahat: !lamaIstirahatVal,
          jenisObat: !obatVal,
          catatanKlinik: !catatanVal
        };
        var hasFieldError = fieldErrors.keputusan || fieldErrors.diagnosa || fieldErrors.lamaIstirahat || fieldErrors.jenisObat || fieldErrors.catatanKlinik;
        S.klinikTandaiErrors[id] = fieldErrors;
        if (S.klinikPetugasError || hasFieldError) {
          render();
          if (S.klinikPetugasError) {
            var el = document.getElementById('klinikPetugasInput');
            if (el) el.focus();
          }
          return;
        }

        btn.disabled = true; btn.textContent = 'Menyimpan...';
        var prevStatus = req.status;
        var prevData = req.data;
        req.status = 'selesai';
        req.data = Object.assign({}, req.data, {
          petugasKlinik: petugasVal,
          completedAt: new Date().toISOString(),
          keputusan: keputusanVal,
          diagnosa: diagnosaVal,
          lamaIstirahat: lamaIstirahatVal,
          jenisObat: obatVal,
          catatanKlinik: catatanVal
        });
        var result = await updateRequest(req);
        if (!result.ok) {
          alert('Gagal menyimpan: ' + result.error);
          req.status = prevStatus; req.data = prevData;
          btn.disabled = false; btn.textContent = 'Tandai Selesai';
          return;
        }
        delete S.klinikTreatmentDraft[id];
        delete S.klinikTandaiErrors[id];
        render();
      });
    });
  }

  function attachForm() {
    var formEl = document.getElementById('dataForm');
    document.querySelectorAll('.field-input').forEach(function (inp) {
      var handler = function () {
        if (!S.formDraft) S.formDraft = {};
        S.formDraft[inp.getAttribute('data-field')] = inp.value;
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    });
    formEl.addEventListener('submit', async function (e) {
      e.preventDefault();
      var t = LETTER_TYPES[S.selectedType];
      var errors = {};
      t.fields.forEach(function (f) {
        if (f.required && !(S.formDraft[f.key] && String(S.formDraft[f.key]).trim())) errors[f.key] = tt('fieldWajib');
      });
      var cekTgl = cekTanggalPerjalanan(S.formDraft, todayISO());
      if (cekTgl.kembali && !errors.tanggalKembali) errors.tanggalKembali = S.lang === 'en' ? cekTgl.kembali.en : cekTgl.kembali.id;
      if (cekTgl.berangkat && !errors.tanggalBerangkat) errors.tanggalBerangkat = S.lang === 'en' ? cekTgl.berangkat.en : cekTgl.berangkat.id;
      S.formErrors = errors;
      if (Object.keys(errors).length > 0) { render(); return; }
      if (!S.dobelDikonfirmasi) {
        var cekBtn = formEl.querySelector('button[type="submit"]');
        var labelAsli = cekBtn.textContent;
        cekBtn.disabled = true; cekBtn.textContent = tt('memeriksa');
        var dobel = await cariPermintaanSerupa(S.selectedType, S.formDraft);
        cekBtn.disabled = false; cekBtn.textContent = labelAsli;
        if (dobel.length) {
          tampilkanPeringatanDobel(dobel, function () { S.dobelDikonfirmasi = true; formEl.requestSubmit(); });
          return;
        }
      }
      S.dobelDikonfirmasi = false;
      var id = generateId(S.selectedType);
      S.pendingId = id;
      if (t.noPayment) {
        var submitBtn = formEl.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = tt('mengirim');
        var newReq = {
          id: id, type: S.selectedType, submittedAt: new Date().toISOString(), status: 'baru',
          paymentChecked: false, paymentNote: '', paymentDate: null, paymentCode: null, amount: 0,
          adminNote: '', nomorSurat: '', tanggalSurat: '', generatedText: '',
          data: Object.assign({}, S.formDraft)
        };
        var result = await insertRequest(newReq);
        if (!result.ok) {
          alert(tt('gagalKirim')(result.error));
          submitBtn.disabled = false; submitBtn.textContent = tt('kirimPermintaan');
          return;
        }
        S.lastRequest = newReq;
        S.pendingId = null;
        go('konfirmasi');
        return;
      }
      go('pembayaran');
    });
  }

  // Cegah permintaan dobel: nama sama + jenis surat sama, belum ditolak. Surat yang sudah selesai
  // hanya dihitung bila diajukan <= 60 hari lalu (belum ada status "sudah diambil").
  // Surat Rekomendasi dianggap dobel hanya bila ada guru yang sama.
  var BATAS_HARI_DOBEL = 60;
  function normNama(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  async function cariPermintaanSerupa(type, draft) {
    var nama = normNama(draft.namaLengkap);
    if (!nama || type === 'IZIN_KLINIK') return [];
    var guruBaru = [draft.namaGuru, draft.namaGuru2, draft.namaGuru3].filter(Boolean).map(normNama);
    var batas = Date.now() - BATAS_HARI_DOBEL * 86400000;
    var all = await getRequestsPublic(); // gagal memuat → [] (tidak menghalangi pengajuan)
    return all.filter(function (r) {
      if (r.type !== type || r.status === 'ditolak' || normNama(r.data.namaLengkap) !== nama) return false;
      if (r.status === 'selesai' && new Date(r.submittedAt).getTime() < batas) return false;
      if (type === 'REKOMENDASI') {
        return (r.guruSlots || []).some(function (g) { return g.status !== 'ditolak' && guruBaru.indexOf(normNama(g.name)) !== -1; });
      }
      return true;
    }).sort(function (a, b) { return new Date(b.submittedAt) - new Date(a.submittedAt); });
  }
  function tampilkanPeringatanDobel(daftar, lanjut) {
    var label = function (r) { return S.lang === 'en' ? statusLabelForEn(r.type, r.status) : statusLabelFor(r.type, r.status); };
    var item = daftar.slice(0, 3).map(function (r) {
      var siap = r.status === 'selesai' && r.type !== 'REKOMENDASI';
      return '<div class="dobel-item"><b class="req-id-small">' + escapeHtml(r.id) + '</b><br>' +
        escapeHtml(formatDateTimeFull(r.submittedAt)) + ' · <b>' + escapeHtml(label(r)) + '</b>' +
        (siap ? '<br>&#128205; ' + escapeHtml(tt('dobelSiapAmbil')) : '') + '</div>';
    }).join('');
    var ov = document.createElement('div');
    ov.className = 'dobel-overlay';
    ov.innerHTML = '<div class="dobel-box" role="dialog" aria-modal="true">' +
      '<h3>&#9888;&#65039; ' + escapeHtml(tt('dobelJudul')) + '</h3>' +
      '<p>' + escapeHtml(tt('dobelIsi')(daftar.length)) + '</p>' + item +
      '<div class="stack">' +
        '<button class="btn-primary" data-dobel="lihat">&#128269; ' + escapeHtml(tt('dobelLihat')) + '</button>' +
        '<button class="btn-outline" data-dobel="tetap">' + escapeHtml(tt('dobelTetap')) + '</button>' +
      '</div>' +
      '<p class="hint center" style="margin-top:10px">' + escapeHtml(tt('dobelTetapHint')) + '</p>' +
    '</div>';
    document.body.appendChild(ov);
    if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch (e) {} }
    ov.addEventListener('click', function (e) {
      var aksi = e.target.closest('[data-dobel]');
      if (e.target === ov) { ov.remove(); return; }
      if (!aksi) return;
      ov.remove();
      if (aksi.getAttribute('data-dobel') === 'lihat') bukaCekStatus(daftar[0].id);
      else lanjut();
    });
  }

    var all = await getRequestsPublic();
    S.statusResults = all.filter(function (r) {

    document.querySelectorAll('[data-fb-msg]').forEach(function (ta) {

        if (!S.feedbackDraft[id]) S.feedbackDraft[id] = {};
        S.feedbackDraft[id].message = ta.value;
      });

    document.querySelectorAll('[data-fb-send]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-fb-send');
        var draft = S.feedbackDraft[id] || {};
        var message = (draft.message || '').trim();
        if (!draft.rating && !message) { S.feedbackMessages[id] = tt('feedbackKosong'); render(); return; }
        btn.disabled = true;
        var result = await submitFeedback(id, draft.rating, message);
        if (result.ok) {
          S.feedbackDone[id] = true;
          delete S.feedbackDraft[id];
          delete S.feedbackMessages[id];
          await runStatusSearch();
        } else {
          S.feedbackMessages[id] = tt('feedbackGagal')(result.error);
        }
        render();
      });
    });
    document.querySelectorAll('[data-fixlink]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var id = btn.getAttribute('data-fixlink');

        if (!newLink) { S.fixLinkMessages[id] = tt('linkBaruKosong'); render(); return; }
        btn.disabled = true; btn.textContent = tt('mengirimLinkBaru');
        var result = await fixRekomendasiLink(id, newLink);
        if (result.ok) {
          S.fixLinkMessages[id] = tt('linkBaruBerhasil');
          await runStatusSearch();
        } else {
          S.fixLinkMessages[id] = tt('linkBaruGagal')(result.error);
          btn.disabled = false; btn.textContent = tt('kirimLinkBaru');
        }
        render();
      });
    });
  }

  function buildCsv(requests) {
    var headers = ['ID', 'Jenis', 'Tanggal', 'Status', 'Nama', 'Jumlah', 'Nomor Surat', 'Detail (JSON)'];
    var lines = [headers.join(',')];
    requests.forEach(function (r) {
      var nama = r.data.namaLengkap || '';
      var rest = JSON.stringify(r.data).replace(/"/g, '""');

  function showPrapenPopup() {
    if (prapenSudahSelesai() || document.getElementById('prapenOverlay')) return;
    prapenState = { grade: '', usaha: '', mulai: '', kondisi: '', jenis: '', step: 1 };
    var overlay = document.createElement('div');
    overlay.id = 'prapenOverlay';
    overlay.className = 'prapen-overlay';
    overlay.innerHTML = '<div class="prapen-modal" role="dialog" aria-modal="true">' +
      '<button type="button" class="prapen-close" aria-label="Close" data-prapen-close>&times;</button>' +
      '<div class="prapen-body" id="prapenBody"></div></div>';
    document.body.appendChild(overlay);
    document.body.classList.add('prapen-noscroll');
    var body = overlay.querySelector('#prapenBody');

    function tutup(tandai) {
      if (tandai) prapenTandaiSelesai();
      overlay.remove();
      document.body.classList.remove('prapen-noscroll');
    }
    async function kirim(t) {
      var btn = body.querySelector('#prapenSubmit');
      btn.disabled = true; btn.textContent = t.mengirim;
      var jawaban = { grade: prapenState.grade, pernah_usaha: prapenState.usaha, bahasa: S.lang === 'en' ? 'en' : 'id' };
      if (prapenState.usaha === 'ya') { jawaban.mulai_usaha = prapenState.mulai; jawaban.kondisi_usaha = prapenState.kondisi; jawaban.jenis_usaha = prapenState.jenis; }
      var res;
      try {
        res = await sb.from('survey_pra').insert({ device_id: prapenDeviceId(), versi: PRAPEN_VERSI, nama: null, kelas: prapenState.grade, jawaban: jawaban });
      } catch (err) { res = { error: { message: String(err && err.message || err) } }; }
      var duplikat = res.error && /duplicate|unique/i.test(res.error.message || '');
      if (res.error && !duplikat) {
        btn.disabled = false; btn.textContent = t.kirim;
        body.querySelector('#prapenFormErr').textContent = t.gagal(res.error.message);
        return;
      }
      prapenTandaiSelesai();
      body.innerHTML = '<div class="prapen-thanks"><div class="seal">&#10003;</div><h2>' + escapeHtml(t.terimaKasih) + '</h2><p class="hint">' + escapeHtml(t.terimaSub) + '</p><button type="button" class="btn-primary" data-prapen-done>' + escapeHtml(t.tutup) + '</button></div>';
      body.querySelector('[data-prapen-done]').onclick = function () { tutup(false); };
    }
    function pasang() {
      body.innerHTML = prapenFormHtml();
      body.scrollTop = 0; overlay.querySelector('.prapen-modal').scrollTop = 0;
      overlay.querySelectorAll('[data-prapen-close]').forEach(function (b) { b.onclick = function () { tutup(true); }; });
      body.querySelectorAll('input[type=radio]').forEach(function (r) {
        r.addEventListener('change', function () {
          prapenState[r.name] = r.value;
          if (r.name === 'usaha') body.querySelector('#prapenSubmit').textContent = PRAPEN_TEKS[S.lang === 'en' ? 'en' : 'id'][r.value === 'ya' ? 'lanjut' : 'kirim'];
        });
      });
      body.querySelector('#prapenLang').onclick = function () { toggleLang(); pasang(); };
      var back = body.querySelector('#prapenBack');
      if (back) back.onclick = function () { prapenState.step = 1; pasang(); };
      body.querySelector('#prapenForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var t = PRAPEN_TEKS[S.lang === 'en' ? 'en' : 'id'];
        body.querySelectorAll('[data-err]').forEach(function (el) { el.textContent = ''; });
        var ok = true;
        function wajib(name) { if (!prapenState[name]) { body.querySelector('[data-err="' + name + '"]').textContent = t.wajib; ok = false; } }
        if (prapenState.step === 1) {
          wajib('grade'); wajib('usaha');
          if (!ok) return;
          if (prapenState.usaha === 'ya') { prapenState.step = 2; pasang(); return; }
          await kirim(t);
        } else {
          wajib('mulai'); wajib('kondisi'); wajib('jenis');
          if (!ok) return;
          await kirim(t);
        }
      });
    }
    pasang();
  }

  var KOP_LOGO = 'kop-logo.png';

  var CETAK_KEY = { ttd: 'surat_ttd_img', cap: 'surat_cap_img', ttdOn: 'surat_ttd_on', capOn: 'surat_cap_on' };

  function cetakGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function cetakSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; } catch (e) { return false; } }
  function cetakOn(k) { return cetakGet(k) !== '0'; }

  function cetakResizeImage(file, maxW) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Gagal membaca file')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('File bukan gambar yang valid')); };
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, maxW / w);
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/png'));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // Ubah teks surat (hasil generator) jadi HTML terstruktur: judul tengah, daftar "Label : isi" rapi, blok tanda tangan.
  function cetakLetterHtml(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    var jabatan = lines.length ? lines.pop() : '';
    var nama = lines.length ? lines.pop() : '';
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    var closing = lines.length ? lines.pop() : '';
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();

    var kvRe = /^(\S.{0,30}?)\s+:\s+(.+)$/;
    var out = '';
    var lastWasGap = true;
    var inKv = false;
    // Tanggal ("Tangerang, ...") dipindah ke bawah judul/nomor, rata kanan.
    var tglLine = '', tglHtml = '';
    if (lines.length && /^Tangerang,/.test(lines[0].trim())) {
      tglLine = lines.shift().trim();
      tglHtml = '<div class="cs-gap"></div><div class="cs-tgl">' + escapeHtml(tglLine) + '</div><div class="cs-gap"></div>';
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (!ln.trim()) {
        if (inKv) { out += '</div>'; inKv = false; }
        if (!lastWasGap) out += '<div class="cs-gap"></div>';
        lastWasGap = true; continue;
      }
      lastWasGap = false;
      var nextLn = lines[i + 1] || '';
      if (/^[A-Z][A-Z0-9 \-–\/&().,]{5,}$/.test(ln.trim()) && (/^No\./.test(nextLn.trim()) || !/cs-(line|kv|title|nomor)/.test(out))) {
        if (inKv) { out += '</div>'; inKv = false; }
        out += '<div class="cs-title">' + escapeHtml(ln.trim()) + '</div>';
        continue;
      }
      if (/^No\.\s*:/.test(ln.trim())) { out += '<div class="cs-nomor">' + escapeHtml(ln.trim()) + '</div>' + tglHtml; tglHtml = ''; continue; }
      var m = kvRe.exec(ln);
      if (m) {
        if (!inKv) { out += '<div class="cs-kv">'; inKv = true; }
        out += '<div class="cs-k">' + escapeHtml(m[1].trim()) + '</div><div class="cs-c">:</div><div class="cs-v">' + escapeHtml(m[2].trim()) + '</div>';
        continue;
      }
      if (inKv) {
        // baris lanjutan nilai (mis. alamat beberapa baris) -> tempel ke nilai terakhir
        var idx = out.lastIndexOf('</div>');
        out = out.slice(0, idx) + '<br>' + escapeHtml(ln.trim()) + out.slice(idx);
        continue;
      }
      out += '<div class="cs-line">' + escapeHtml(ln.trim()) + '</div>';
    }
    if (inKv) out += '</div>';
    if (tglHtml) out = '<div class="cs-tgl">' + escapeHtml(tglLine) + '</div><div class="cs-gap"></div>' + out; // teks tanpa "No." (diedit manual)
    return { body: out, closing: closing.trim(), nama: nama.trim(), jabatan: jabatan.trim() };
  }

  // Ambil keadaan terbaru dari halaman detail (teks yang mungkin diedit, tanggal, nomor ketik manual).
  function salinanDariDetail(req) {
    var copy = cloneReq(req);
    var area = document.getElementById('generatedTextArea'), inp = document.getElementById('nomorSuratInput'), tgl = document.getElementById('tanggalSuratInput');
    if (tgl && tgl.value) copy.tanggalSurat = tgl.value;
    if (inp) {
      var sm = inp.getAttribute('data-sementara'), v = inp.value.trim();
      if (v && (copy.nomorSurat || (sm !== null && v !== sm))) copy.nomorSurat = v;
    }
    if (area && area.value.trim()) copy.generatedText = area.value.trim();
    return copy;
  }
  // Nomor surat resmi dipakai di sini saja (saat dicetak / diunduh Word / diterbitkan PDF / disetujui).
  // Surat tanpa nomor mendapat nomor berikutnya dari server; baris "No. :" di teks ikut disesuaikan.
  async function kunciNomorSurat(req) {
    var copy = cloneReq(req);
    var tgl = copy.tanggalSurat || todayISO();
    copy.tanggalSurat = tgl;
    var fresh = await getSettingsStrict();
    if (!fresh) throw new Error('Gagal membaca nomor surat berikutnya dari server. Coba lagi.');
    var next = fresh.nextSuratNumber;
    if (!copy.nomorSurat) { copy.nomorSurat = suggestedNomor(fresh, tgl); next = next + 1; }
    else { var n = parseInt(copy.nomorSurat, 10); if (n >= next) next = n + 1; }
    var text = copy.generatedText || generateLetterText(copy, copy.nomorSurat, tgl);
    copy.generatedText = /^No\.\s*:/m.test(text) ? text.replace(/^No\.\s*:.*$/m, 'No. : ' + copy.nomorSurat) : text;
    var res = await updateRequest(copy);
    if (!res.ok) throw new Error('Gagal menyimpan nomor surat: ' + res.error);
    replaceReq(copy);
    S.settings = Object.assign({}, S.settings || {}, fresh, { nextSuratNumber: next });
    if (next !== fresh.nextSuratNumber && !(await saveSettings(S.settings))) {
      throw new Error('Nomor ' + copy.nomorSurat + ' tersimpan, tapi penghitung nomor gagal disimpan. Cek Pengaturan (Nomor Surat Berikutnya) sebelum lanjut.');
    }
    return copy;
  }
  function judulFileSurat(req) { return namaFileSurat(req, 'pdf').replace(/\.pdf$/, ''); }
  // Nomor resmi hanya keluar lewat TERBIT. Cetak/Word untuk surat yang belum terbit -> tawarkan terbit dulu.
  // Kembalikan surat (sudah bernomor) atau null kalau dibatalkan.
  async function pastikanTerbit(req) {
    if (req.nomorSurat) return await kunciNomorSurat(req); // sudah memegang nomor: pakai nomornya
    if (!confirm('Surat ini belum terbit, jadi belum punya nomor resmi.\n\nTerbitkan sekarang? Nomor surat diberikan, PDF dibuat untuk siswa, dan status menjadi Selesai. Setelah itu lanjut cetak/Word.')) return null;
    if (!konfirmasiTtdCap()) return null;
    var fin = await kunciNomorSurat(req);
    await terbitkanPdf(fin);
    return S.requests.find(function (r) { return r.id === fin.id; }) || fin;
  }

  function showCetakSurat(text, judulFile, sebelumCetak) {
    var old = document.getElementById('cetakOverlay'); if (old) old.remove();
    var ov = document.createElement('div');
    ov.id = 'cetakOverlay';
    document.body.appendChild(ov);
    document.body.classList.add('cetak-mode');
    var titleAsal = document.title;
    function gambar() {
      var adaTtd = !!cetakGet(CETAK_KEY.ttd), adaCap = !!cetakGet(CETAK_KEY.cap);
      ov.innerHTML = '<div class="cetak-bar">' +
        '<button type="button" class="btn-primary" id="cetakPrintBtn" style="width:auto;margin:0;padding:8px 18px">Cetak / Simpan PDF</button>' +
        '<button type="button" class="btn-outline" id="cetakCloseBtn" style="width:auto;margin:0;padding:8px 18px;background:#fff">Tutup</button>' +
        '<label><input type="checkbox" id="cetakTtdChk"' + (cetakOn(CETAK_KEY.ttdOn) ? ' checked' : '') + (adaTtd ? '' : ' disabled') + '> TTD' + (adaTtd ? '' : ' (belum diunggah)') + '</label>' +
        '<label><input type="checkbox" id="cetakCapChk"' + (cetakOn(CETAK_KEY.capOn) ? ' checked' : '') + (adaCap ? '' : ' disabled') + '> Cap' + (adaCap ? '' : ' (belum diunggah)') + '</label>' +
        '<span class="cetak-tip">Di jendela cetak: pilih "Save as PDF", ukuran A4, margin None, matikan Headers and footers.</span>' +
      '</div>' + cetakSheetHtml(text);
      ov.querySelector('#cetakCloseBtn').onclick = tutup;
      ov.querySelector('#cetakPrintBtn').onclick = async function () {
        var tunggu = 50;
        if (sebelumCetak) {
          var btn = this; btn.disabled = true; btn.textContent = 'Menyiapkan nomor...';
          try {
            var hasil = await sebelumCetak();
            if (hasil === null) { gambar(); return; } // dibatalkan
            if (hasil) { text = hasil.text || text; judulFile = hasil.judul || judulFile; diubah = true; gambar(); tunggu = 400; }
          } catch (e) { alert(e && e.message || e); gambar(); return; }
        }
        document.title = judulFile || 'Surat';
        setTimeout(function () { window.print(); }, tunggu);
      };
      ov.querySelector('#cetakTtdChk').onchange = function (e) { cetakSet(CETAK_KEY.ttdOn, e.target.checked ? '1' : '0'); gambar(); };
      ov.querySelector('#cetakCapChk').onchange = function (e) { cetakSet(CETAK_KEY.capOn, e.target.checked ? '1' : '0'); gambar(); };
    }
    var diubah = false;
    function tutup() {

  var SURAT_SIMPLE = ['VISA', 'KKM_STATEMENT', 'KETERANGAN', 'SKL_EXPECTED', 'SKL_EXPECTED_UNIV', 'SKL_COMPLETED'];

  async function currentEmail() {
    try { var r = await sb.auth.getSession(); return (r.data.session.user.email) || ''; } catch (e) { return ''; }
  }
  function cloneReq(req) { return Object.assign({}, req, { data: Object.assign({}, req.data) }); }
  function replaceReq(updated) {
    var i = S.requests.findIndex(function (r) { return r.id === updated.id; });
    if (i >= 0) S.requests[i] = updated;
  }
  function byOldest(a, b) { return new Date(a.submittedAt) - new Date(b.submittedAt); }
  function shortWho(email) { return String(email || '').split('@')[0] || '-'; }

  function financeRequests() {
    return S.requests.filter(function (r) { return !isDedicatedTabType(r.type) && LETTER_TYPES[r.type] && !LETTER_TYPES[r.type].noPayment; });
  }
  function financeJumlah(r) { return r.amount != null ? r.amount : FEE; }
  function financeBucket(r) {
    if (r.status === 'baru') return 'belum';
    if (r.status === 'pembayaran_belum_diterima') return 'tidak';
    if (r.status === 'ditolak') return 'lain';
    return 'lunas';
  }
  function financeFiltered() {
    var q = (S.financeSearch || '').trim().toLowerCase();
    return financeRequests().filter(function (r) {
      if (S.financeFilter !== 'all' && financeBucket(r) !== S.financeFilter) return false;
      if (q) {
        var d = r.data || {};
        var hay = [r.id, d.namaLengkap, d.kelas, r.paymentNote].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) { return byOldest(b, a); });
  }

  async function financeSetStatus(ids, aksi, note) {
    var email = await currentEmail(), now = new Date().toISOString(), gagal = [];
    for (var i = 0; i < ids.length; i++) {
      var req = S.requests.find(function (r) { return r.id === ids[i]; });
      if (!req || req.status === 'selesai') continue;
      var copy = cloneReq(req);
      if (aksi === 'lunas') {
        if (req.status === 'pembayaran_belum_diterima') copy.adminNote = '';
        copy.status = 'lunas'; copy.data.lunasAt = now; copy.data.lunasOleh = email;
      } else {
        copy.status = 'pembayaran_belum_diterima';
        delete copy.data.lunasAt; delete copy.data.lunasOleh; delete copy.data.disetujuiAt; delete copy.data.disetujuiOleh;
        if (note) copy.adminNote = note;
      }
      var res = await updateRequest(copy);
      if (res.ok) replaceReq(copy); else gagal.push(req.id + ' (' + res.error + ')');
    }
    return gagal;
  }

  function buildFinanceCsv(list) {
    var lines = [['Kode', 'Nama', 'Kelas', 'Jenis Surat', 'Jumlah', 'Tanggal Bayar', 'Nama Pengirim', 'Status', 'Dilunaskan Oleh', 'Waktu Lunas'].map(csvField).join(',')];
    list.forEach(function (r) {
      var d = r.data || {};
      lines.push([r.id, d.namaLengkap || '', d.kelas || '', LETTER_TYPES[r.type].shortLabel, financeJumlah(r), r.paymentDate || '', r.paymentNote || '',
        statusLabelFor(r.type, r.status), d.lunasOleh || '', d.lunasAt ? ymdHm(d.lunasAt) : ''].map(csvField).join(','));
    });
    return lines.join('\n');
  }

  function buildFinanceTsv(list) {
    function f(v) { return String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' '); }
    var lines = [['No', 'Nama', 'Kelas', 'Surat', 'Jumlah', 'Atas Nama (Pengirim)', 'Tgl Bayar', 'Status'].join('\t')];
    list.forEach(function (r, i) {
      var d = r.data || {};
      lines.push([i + 1, d.namaLengkap, d.kelas, LETTER_TYPES[r.type].shortLabel, financeJumlah(r), r.paymentNote, r.paymentDate ? formatDateShort(r.paymentDate) : '', financeStatusText(r)].map(f).join('\t'));
    });
    return lines.join('\n');
  }
